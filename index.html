<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Leap & Learn Editor - English Bootcamp</title>
<style>
  :root { --primary: #7cf9ff; --dark: #0a1730; --panel: #142342; --text: #eaf6ff; --accent: #4dff88; }
  body { margin:0; display:flex; height:100vh; background: #050b1a; color: var(--text); font-family: 'Segoe UI', sans-serif; overflow:hidden; }
  
  /* SIDEBAR */
  #EDITOR { width: 460px; background: var(--dark); border-right: 1px solid #333; display:flex; flex-direction:column; z-index:10; box-shadow: 4px 0 15px rgba(0,0,0,0.3); }
  
  /* HEADER С ЛОГОТИПОМ */
  #EDITOR_HEADER { 
    padding: 15px; 
    background: var(--panel); 
    border-bottom: 1px solid #333; 
    display: flex; 
    align-items: center; 
    justify-content: center; /* Центрируем лого */
    height: 70px;
  }
  
  /* Стили для Неонового Логотипа */
  .neon-logo {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 5px #00e5ff) drop-shadow(0 0 10px #00e5ff); /* Неоновое свечение */
      transition: filter 0.3s ease;
  }
  .neon-logo:hover {
      filter: drop-shadow(0 0 8px #00e5ff) drop-shadow(0 0 20px #00e5ff);
  }

  #TABS { display:flex; background:#000; flex-wrap:wrap; }
  .tab { flex:1; min-width:60px; padding:10px 5px; text-align:center; cursor:pointer; background:#111; color:#888; font-size:12px; border-bottom:2px solid transparent; transition:0.2s; user-select:none; }
  .tab:hover { background:#222; color:#fff; }
  .tab.active { background:var(--panel); color:var(--primary); border-bottom:2px solid var(--primary); }
  
  #CONTENT { flex:1; overflow-y:auto; padding:15px; background:var(--panel); }
  .page { display:none; animation: fadeIn 0.3s; }
  .page.active { display:block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

  /* CONTROLS */
  .control-group { margin-bottom:15px; background:rgba(0,0,0,0.2); padding:10px; border-radius:6px; border:1px solid rgba(255,255,255,0.05); }
  .control-group label { display:block; margin-bottom:6px; font-size:12px; color:#aaa; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; }
  input[type="text"], input[type="number"], textarea, select {
    width:100%; box-sizing:border-box; background:#050b1a; border:1px solid #333; color:#fff; padding:8px; border-radius:4px; font-size:14px;
  }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 5px rgba(124,249,255,0.3); }
  textarea { resize:vertical; min-height:60px; }
  
  .btn { width:100%; padding:10px; border:none; border-radius:4px; cursor:pointer; font-weight:bold; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:5px; }
  .btn.primary { background: linear-gradient(45deg, var(--primary), #00d2ff); color:#000; box-shadow: 0 4px 10px rgba(124,249,255,0.3); }
  .btn.primary:hover { transform:translateY(-1px); box-shadow: 0 6px 15px rgba(124,249,255,0.5); }
  .btn.secondary { background: #333; color:#fff; }
  .btn.secondary:hover { background:#444; }
  .btn.danger { background: #ff4d4d; color:white; }
  
  /* LIST ITEMS */
  .item-list { display:flex; flex-direction:column; gap:8px; }
  .list-item { display:flex; gap:5px; background:#0a1730; padding:8px; border-radius:4px; align-items:center; border:1px solid #333; }
  .list-item input { border:none; background:transparent; }
  .del-btn { width:24px; height:24px; background:#ff4d4d; color:#fff; border:none; border-radius:3px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  /* PREVIEW */
  #PREVIEW { flex:1; background:#000; position:relative; display:flex; flex-direction:column; }
  #TOOLBAR { height:40px; background:#111; display:flex; align-items:center; padding:0 10px; gap:10px; border-bottom:1px solid #333; }
  .tool-btn { background:transparent; border:1px solid #444; color:#aaa; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
  .tool-btn.active { background:var(--primary); color:#000; border-color:var(--primary); }
  iframe { flex:1; border:none; width:100%; height:100%; background: #050b1a; }

  /* COPYRIGHT FOOTER */
  #COPYRIGHT {
      margin-top: auto;
      padding: 10px 15px;
      font-size: 10px;
      color: #555;
      text-align: center;
      border-top: 1px solid #222;
      background: #081020;
  }

  /* Audio Input Style */
  .audio-input-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:5px; }
  .audio-status { font-size: 10px; color: var(--accent); display:none; }
  .audio-status.loaded { display:inline; }
</style>
</head>
<body>

<div id="EDITOR">
  
  <div id="EDITOR_HEADER">
    <img src="" id="LOGO_IMG" class="neon-logo" alt="English Bootcamp">
  </div>
  
  <div id="TABS">
    <div class="tab active" onclick="setTab('levels')">Levels</div>
    <div class="tab" onclick="setTab('settings')">Settings</div>
    <div class="tab" onclick="setTab('design')">Design</div>
    <div class="tab" onclick="setTab('fonts')">Fonts & Sound</div>
  </div>

  <div id="CONTENT">
    
    <div id="tab_levels" class="page active">
      <div class="control-group">
        <label>Game Task (Question)</label>
        <input type="text" id="GLOBAL_TASK" placeholder="e.g. Jump on the VERBS!" oninput="upd()">
      </div>
      
      <div class="control-group">
        <label>Words (One per line)</label>
        <div style="font-size:11px; color:#888; margin-bottom:5px;">Format: Word [Correct/Wrong]<br>Example: Run [c]</div>
        <textarea id="WORDS_INPUT" style="height:200px" oninput="parseWords()">Run [c]
Jump [c]
Table [w]
Sleep [c]
Apple [w]
Blue [w]
Eat [c]</textarea>
      </div>
      
      <div class="control-group">
         <label>Level Stats</label>
         <div id="STATS_INFO" style="font-size:12px; color:#aaa;">Correct: 4 | Wrong: 3</div>
      </div>
    </div>

    <div id="tab_settings" class="page">
      <div class="control-group">
        <label>Timer (Seconds)</label>
        <input type="number" id="SET_TIMER" value="60" oninput="upd()">
      </div>
      <div class="control-group">
        <label>Speed (1-10)</label>
        <input type="range" id="SET_SPEED" min="1" max="10" value="4" style="width:100%" oninput="upd()">
      </div>
      <div class="control-group">
        <label>Platform Density</label>
        <select id="SET_DENSITY" onchange="upd()">
           <option value="low">Low</option>
           <option value="medium" selected>Medium</option>
           <option value="high">High</option>
        </select>
      </div>
      <div class="control-group">
        <label>Win Score</label>
        <input type="number" id="SET_WIN_SCORE" value="1000" oninput="upd()">
      </div>
    </div>

    <div id="tab_design" class="page">
      <div class="control-group">
        <label>Background (URL or Base64)</label>
        <input type="text" id="GFX_BG" placeholder="https://..." oninput="upd()">
        <input type="file" id="FILE_BG" style="margin-top:5px" onchange="encodeImg(this, 'GFX_BG')">
      </div>
      
      <div class="control-group">
        <label>Platform Color</label>
        <input type="color" id="GFX_PLAT" value="#4dff88" style="width:100%; height:40px;" oninput="upd()">
      </div>
      
      <div class="control-group">
        <label>Character (URL/Base64)</label>
        <input type="text" id="GFX_CHAR" placeholder="Leave empty for Frog" oninput="upd()">
        <input type="file" style="margin-top:5px" onchange="encodeImg(this, 'GFX_CHAR')">
      </div>
    </div>

    <div id="tab_fonts" class="page">
      <div class="control-group">
        <label>Game Font</label>
        <select id="GFX_FONT" onchange="upd()">
          <option value="Segoe UI">Segoe UI (Standard)</option>
          <option value="'Courier New', monospace">Courier New</option>
          <option value="'Comic Sans MS', cursive">Comic Sans</option>
          <option value="Impact, sans-serif">Impact</option>
          <option value="Georgia, serif">Georgia</option>
        </select>
      </div>

      <hr style="border:0; border-top:1px solid #333; margin: 15px 0;">
      
      <h3 style="margin:0 0 10px 0; color:var(--primary); font-size:14px;">Custom Sounds</h3>
      
      <div class="control-group">
        <label>Correct Answer Sound 🔊</label>
        <div class="audio-input-row">
            <input type="file" accept="audio/*" onchange="loadAudio('correct', this)">
            <span id="stat_correct" class="audio-status">Loaded!</span>
        </div>
      </div>

      <div class="control-group">
        <label>Wrong Answer Sound 🔊</label>
        <div class="audio-input-row">
            <input type="file" accept="audio/*" onchange="loadAudio('wrong', this)">
            <span id="stat_wrong" class="audio-status">Loaded!</span>
        </div>
      </div>

      <div class="control-group">
        <label>Win Sound (Level Complete) 🔊</label>
        <div class="audio-input-row">
            <input type="file" accept="audio/*" onchange="loadAudio('win', this)">
            <span id="stat_win" class="audio-status">Loaded!</span>
        </div>
      </div>

      <div class="control-group">
        <label>Game Over Sound 🔊</label>
        <div class="audio-input-row">
            <input type="file" accept="audio/*" onchange="loadAudio('lose', this)">
            <span id="stat_lose" class="audio-status">Loaded!</span>
        </div>
      </div>

    </div>

  </div>

  <div style="padding:15px; background:#111; border-top:1px solid #333;">
    <button class="btn primary" onclick="copyCode()">📋 Copy Game Code</button>
  </div>

  <div id="COPYRIGHT">
    © Права принадлежат разработчику Башлыковой Оксане Михайловне
  </div>

</div>

<div id="PREVIEW">
  <div id="TOOLBAR">
    <span style="font-weight:bold; color:#fff; margin-right:auto;">Game Preview</span>
    <button id="btnGame" class="tool-btn active" onclick="toggleView('game')">Game Mode</button>
    <button id="btnRules" class="tool-btn" onclick="toggleView('rules')">Rules Screen</button>
  </div>
  <iframe id="previewFrame"></iframe>
</div>

<script>
/* ---------------- EDITOR LOGIC ---------------- */
let wordsData = [];
let viewMode = 'game';

// Хранилище для пользовательских звуков
let customSounds = {
    correct: null,
    wrong: null,
    win: null,
    lose: null
};

// Функция загрузки логотипа
// ВАЖНО: Вставьте сюда Base64 вашего логотипа English Bootcamp
const myLogoBase64 = ""; // <-- ВСТАВЬТЕ СЮДА ВАШ ДЛИННЫЙ КОД
if(myLogoBase64) {
    document.getElementById('LOGO_IMG').src = myLogoBase64;
} else {
    // Заглушка, если код не вставлен, чтобы вы видели, где он должен быть
    document.getElementById('LOGO_IMG').alt = "LOGO PLACEHOLDER (Insert Base64 in Code)";
}

function setTab(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab_'+t).classList.add('active');
}

function parseWords(){
  const raw = document.getElementById('WORDS_INPUT').value;
  const lines = raw.split('\n');
  let c=0, w=0;
  wordsData = [];
  lines.forEach(l=>{
    if(!l.trim()) return;
    const isC = l.includes('[c]');
    const isW = l.includes('[w]');
    let txt = l.replace('[c]','').replace('[w]','').trim();
    if(isC || isW) {
      if(isC) c++; else w++;
      wordsData.push({ text: txt, type: isC ? 'correct' : 'wrong' });
    }
  });
  document.getElementById('STATS_INFO').innerText = `Correct: ${c} | Wrong: ${w}`;
  upd();
}

function encodeImg(input, targetID){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById(targetID).value = e.target.result;
    upd();
  }
  reader.readAsDataURL(file);
}

// Функция загрузки аудио
function loadAudio(type, input) {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        customSounds[type] = e.target.result;
        document.getElementById('stat_' + type).classList.add('loaded');
        upd();
    }
    reader.readAsDataURL(file);
}

function copyCode(){
  const html = getGameHTML();
  navigator.clipboard.writeText(html).then(()=>alert('Game code copied! Paste inside Genially > Insert > Others.'));
}

/* ---------------- GENERATOR LOGIC ---------------- */
function getGameHTML(){
  const task = document.getElementById('GLOBAL_TASK').value || "Jump on correct words!";
  const timer = document.getElementById('SET_TIMER').value;
  const speed = document.getElementById('SET_SPEED').value;
  const density = document.getElementById('SET_DENSITY').value;
  const bg = document.getElementById('GFX_BG').value;
  const char = document.getElementById('GFX_CHAR').value;
  const platCol = document.getElementById('GFX_PLAT').value;
  const font = document.getElementById('GFX_FONT').value;
  const winScore = document.getElementById('SET_WIN_SCORE').value;

  // Prepare sounds JSON
  const soundsJSON = JSON.stringify(customSounds);

  const wordsJSON = JSON.stringify(wordsData);

  // JS CODE FOR GAME
  const js = `
<script>
(function(){
  const CONFIG = {
    words: ${wordsJSON},
    task: "${task}",
    time: ${timer},
    speed: ${speed},
    density: "${density}",
    winScore: ${winScore},
    assets: {
      bg: "${bg}",
      char: "${char}",
      platColor: "${platCol}",
      font: "${font}"
    },
    audio: ${soundsJSON} // Внедряем звуки
  };

  /* --- ENGINE --- */
  const canvas = document.getElementById('G');
  const ctx = canvas.getContext('2d');
  let W=800, H=600;
  
  // Game State
  let state = 'rules'; // rules, game, end
  let score = 0;
  let penalties = 0;
  let timeLeft = CONFIG.time;
  let frames = 0;
  let gameLoop;
  let timerInt;
  
  // Audio System
  // Default fallback sounds (short beeps generated by AudioContext usually, but here using data URI placeholders or empty for simplicity if not provided)
  // For this version, we will check CONFIG.audio. If empty, we use silence or defaults.
  
  const Sounds = {
     play: (key) => {
        if(CONFIG.audio && CONFIG.audio[key]) {
            new Audio(CONFIG.audio[key]).play().catch(e=>console.log('Audio blocked'));
        } else {
            // Default Beeps logic could go here, or just silent fallback
            // console.log("Play default sound for", key);
        }
     }
  };

  /* ... PHYSICS & RENDER ... */
  // Minimal Physics Engine
  const frog = { x:400, y:300, w:40, h:40, vx:0, vy:0, grounded:false, facing:1 };
  let platforms = [];
  let particles = [];
  
  function init(){
    // Resize
    resize();
    window.addEventListener('resize', resize);
    
    // Inputs
    window.addEventListener('keydown', e=>{
       if(state!=='game') return;
       if(e.code==='ArrowLeft') frog.vx = -5;
       if(e.code==='ArrowRight') frog.vx = 5;
       if(e.code==='ArrowUp' && frog.grounded) { frog.vy = -12; frog.grounded=false; }
    });
    window.addEventListener('keyup', e=>{
       if(e.code==='ArrowLeft' || e.code==='ArrowRight') frog.vx = 0;
    });
    
    // Setup DOM
    document.getElementById('TASK_TEXT').innerText = CONFIG.task;
    if(CONFIG.assets.bg) document.body.style.backgroundImage = "url('"+CONFIG.assets.bg+"')";
    document.body.style.fontFamily = CONFIG.assets.font;
    
    document.getElementById('BTN_START').onclick = startGame;
    document.getElementById('RETRY').onclick = startGame;
    document.getElementById('NEXT_LEVEL').style.display = 'none'; // logic for levels later
    document.getElementById('FINISH').onclick = ()=>window.parent.postMessage('finish','*');
    
    // View Message
    window.addEventListener('message', e=>{
       if(e.data==='rules') showScreen('rules');
       if(e.data==='game') showScreen('game'); // actually start
    });
  }

  function resize(){
     W = window.innerWidth;
     H = window.innerHeight;
     canvas.width=W; canvas.height=H;
  }

  function showScreen(s){
    state = s;
    document.getElementById('UI_RULES').style.display = s==='rules'?'flex':'none';
    document.getElementById('UI_GAME').style.display = s==='game'?'block':'none';
    document.getElementById('UI_END').style.display = s==='end'?'flex':'none';
    if(s==='game' && !gameLoop) startGame();
  }

  function startGame(){
    state = 'game';
    score=0; penalties=0; timeLeft=CONFIG.time;
    frog.x=W/2; frog.y=100; frog.vx=0; frog.vy=0;
    platforms=[];
    
    document.getElementById('UI_RULES').style.display='none';
    document.getElementById('UI_END').style.display='none';
    document.getElementById('UI_GAME').style.display='block';
    
    updateHUD();
    
    if(gameLoop) cancelAnimationFrame(gameLoop);
    if(timerInt) clearInterval(timerInt);
    
    timerInt = setInterval(()=>{
       timeLeft--;
       updateHUD();
       if(timeLeft<=0) endGame(false);
    }, 1000);
    
    loop();
  }
  
  function spawnPlatform(y){
     // Simple generator
     const wIndex = Math.floor(Math.random()*CONFIG.words.length);
     const wordObj = CONFIG.words[wIndex] || {text:'?', type:'wrong'};
     
     platforms.push({
        x: Math.random() * (W-100),
        y: y,
        w: 120 + wordObj.text.length*10,
        h: 30,
        word: wordObj,
        touched: false
     });
  }
  
  function loop(){
    if(state!=='game') return;
    
    ctx.clearRect(0,0,W,H);
    
    // Physics
    frog.vy += 0.5; // Gravity
    frog.x += frog.vx;
    frog.y += frog.vy;
    
    // Floor
    if(frog.y > H) { endGame(false); return; }
    
    // Platforms logic (scroll up)
    let scrollSpeed = CONFIG.speed * 0.5;
    
    if(platforms.length < 5 || platforms[platforms.length-1].y > 150) {
       spawnPlatform(-50);
    }
    
    frog.grounded=false;
    
    platforms.forEach((p,i)=>{
       p.y += scrollSpeed;
       
       // Draw Plat
       ctx.fillStyle = CONFIG.assets.platColor;
       ctx.fillRect(p.x, p.y, p.w, p.h);
       
       // Text
       ctx.fillStyle = "#000";
       ctx.font = "bold 16px "+CONFIG.assets.font;
       ctx.fillText(p.word.text, p.x+10, p.y+20);
       
       // Collision
       if(frog.vy > 0 && 
          frog.x+frog.w > p.x && frog.x < p.x+p.w && 
          frog.y+frog.h > p.y && frog.y+frog.h < p.y+p.h+10 &&
          !p.touched
         ){
          frog.grounded = true;
          frog.vy = 0;
          frog.y = p.y - frog.h;
          
          p.touched = true;
          if(p.word.type==='correct') {
             score += 100;
             Sounds.play('correct');
             // Visual FX could go here
          } else {
             score -= 50;
             penalties++;
             Sounds.play('wrong');
          }
          updateHUD();
       }
    });
    
    // Cleanup
    platforms = platforms.filter(p=>p.y<H);
    
    // Draw Frog
    ctx.fillStyle = "#fff";
    if(CONFIG.assets.char) {
        // Draw Image if loaded (simplified for datauri, normally needs preloader)
        const img = new Image();
        img.src = CONFIG.assets.char;
        ctx.drawImage(img, frog.x, frog.y, 40, 40);
    } else {
        // Default Frog Rect
        ctx.fillStyle = "#4dff88";
        ctx.fillRect(frog.x, frog.y, 40, 40);
    }
    
    // Check Win
    if(score >= CONFIG.winScore) endGame(true);

    gameLoop = requestAnimationFrame(loop);
  }
  
  function updateHUD(){
    document.getElementById('SCORE_VAL').innerText = score;
    document.getElementById('TIME_VAL').innerText = timeLeft;
  }
  
  function endGame(win){
    state = 'end';
    clearInterval(timerInt);
    cancelAnimationFrame(gameLoop);
    
    document.getElementById('UI_GAME').style.display='none';
    document.getElementById('UI_END').style.display='flex';
    
    document.getElementById('FINAL_LABEL').innerText = win ? "LEVEL COMPLETE!" : "GAME OVER";
    document.getElementById('FINAL_SCORE').innerText = "Final Score: " + score;
    document.getElementById('STAT_C').innerText = "⭐ " + Math.floor(score/100);
    document.getElementById('STAT_P').innerText = "⚠️ " + penalties;
    
    if(win) Sounds.play('win'); else Sounds.play('lose');
  }

  init();

})();
<\/script>`;

  return `<!DOCTYPE html>
<html><head>
<style>
  body{margin:0; overflow:hidden; background:#222; color:white; user-select:none;}
  #G { display:block; }
  .screen { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:10; }
  h1 { font-size:40px; color:#4dff88; text-shadow:0 0 10px #4dff88; margin:0 0 20px 0; }
  p { font-size:18px; max-width:600px; text-align:center; line-height:1.5; }
  .btn { background:#4dff88; color:#000; border:none; padding:15px 40px; font-size:20px; font-weight:bold; cursor:pointer; margin-top:30px; border-radius:30px; transition:0.2s; }
  .btn:hover { transform:scale(1.1); box-shadow:0 0 20px #4dff88; }
  .btn.dark { background:#444; color:#aaa; }
  
  #UI_GAME { display:none; position:absolute; top:0; left:0; width:100%; padding:20px; box-sizing:border-box; pointer-events:none; }
  .hud { display:flex; justify-content:space-between; font-size:24px; font-weight:bold; text-shadow:1px 1px 2px #000; }
  
  #UI_END .stats { background:rgba(255,255,255,0.1); padding:20px; border-radius:10px; min-width:300px; }
  .row { display:flex; justify-content:space-between; margin:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px; }
  .label { color:#aaa; }
  .value { color:#fff; font-weight:bold; }
  
  #FROG_WRAP { display:none; } /* Logic handled in canvas for this version */
</style>
</head><body>
<canvas id="G"></canvas>

<div id="UI_RULES" class="screen">
  <h1>HOW TO PLAY</h1>
  <p id="TASK_TEXT">Task description here...</p>
  <p style="font-size:14px; color:#888; margin-top:10px;">Use ARROW KEYS to move and jump.</p>
  <button id="BTN_START" class="btn">PLAY ▶</button>
</div>

<div id="UI_GAME">
  <div class="hud">
    <div style="color:#4dff88">SCORE: <span id="SCORE_VAL">0</span></div>
    <div style="color:#ff4d4d">TIME: <span id="TIME_VAL">60</span></div>
  </div>
</div>

<div id="UI_END" class="screen" style="display:none">
  <div class="stats">
    <div id="FINAL_LINE" style="text-align:center; margin-bottom:20px;">
        <div id="FINAL_LABEL" style="font-size:24px; color:#4dff88; margin-bottom:5px;">COMPLETE</div>
        <div id="FINAL_SCORE" style="font-size:18px;">Score: 0</div>
    </div>
    <div class="row"><div class="label">Correct Jumps</div><div id="STAT_C" class="value">0</div></div>
    <div class="row"><div class="label">Penalties</div><div id="STAT_P" class="value">0</div></div>
  </div>
  <div id="END_BTNS" style="margin-top:20px; display:flex; gap:10px;">

</div>

${js}
</body></html>`;
}

/* EDITOR UTILS */
let updTimer;
function upd(){ clearTimeout(updTimer); updTimer=setTimeout(updatePreview,500); }
function updatePreview(){
  const html=getGameHTML();
  const f=document.getElementById('previewFrame');
  f.srcdoc=html;
  // Небольшая задержка, чтобы iframe успел загрузиться
  f.onload=()=>{
    f.contentWindow.postMessage(viewMode,'*');
  };
}
function toggleView(m){
  viewMode=m;
  document.getElementById('btnRules').classList.toggle('active',m==='rules');
  document.getElementById('btnGame').classList.toggle('active',m==='game');
  updatePreview();
}

// Инициализация
parseWords();
</script>
