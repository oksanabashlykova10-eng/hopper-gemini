<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Leap and Learn - Ultra Editor</title>
    <style>
        :root { --accent: #7cf9ff; --bg: #0b1630; --panel: #16213e; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 450px; background: var(--panel); padding: 20px; overflow-y: auto; border-right: 2px solid var(--accent); box-shadow: 10px 0 20px rgba(0,0,0,0.5); z-index: 10; }
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(124,249,255,0.1); }
        h3 { margin-top: 0; color: var(--accent); font-size: 16px; text-transform: uppercase; border-bottom: 1px solid var(--accent); padding-bottom: 5px; }
        
        label { display: block; margin: 12px 0 5px; font-size: 13px; opacity: 0.9; }
        input[type="color"], input[type="text"], input[type="number"], select { 
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(124,249,255,0.3); 
            background: #0f3460; color: white; box-sizing: border-box;
        }
        
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .btn { 
            background: var(--accent); color: #000; border: none; padding: 12px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s;
        }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-edit { width: auto; padding: 5px 10px; background: #ffe44d; }

        /* Level Item */
        .level-item { 
            background: rgba(0,0,0,0.3); padding: 10px; margin: 10px 0; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center; border: 1px dashed var(--accent);
        }

        /* Modal Question Editor */
        #modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 100; align-items: center; justify-content: center; 
        }
        .modal-content { 
            background: var(--panel); width: 90%; max-width: 600px; max-height: 80vh; 
            overflow-y: auto; padding: 30px; border-radius: 20px; border: 2px solid var(--accent);
        }

        /* Preview Area */
        #preview-container { flex-grow: 1; display: flex; flex-direction: column; background: #000; }
        #game-frame { width: 100%; height: 100%; border: none; }
        .top-bar { padding: 15px; background: #0f3460; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="color:var(--accent)">🚀 Leap & Learn Editor</h2>
    
    <div class="section">
        <h3>🎨 Локация и Герой</h3>
        <label>Фон игры</label>
        <select id="bgSelect" onchange="updatePreview()">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/c0c9010f-c3dd-42c1-b7c1-65024fa3aec6.png">Река</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/fa2ab459-fec9-4ccd-97e3-254427b4ade0.png">Лава</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/02b52ad4-9d31-4b21-a305-8fec6e8a4487.png">Болото</option>
        </select>
        <label>Персонаж</label>
        <select id="charSelect" onchange="updatePreview()">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/3074df22-5c73-4ad2-b0b2-491c6fc247f3.png">Лягушка</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/74b56fcf-5354-43dd-9c9a-f50facc9a9bf.png">Хамелеон</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/0feda2a1-485a-4654-8640-bf1adcc9f9ec.png">Ящерица</option>
        </select>
        <label>Платформа</label>
        <select id="platformSelect" onchange="updatePreview()">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/ed6c6e82-953b-43d4-947d-e46227b760f0.png">Кувшинка</option>
            <option value="https://via.placeholder.com/150?text=Stone">Камень (URL)</option>
            <option value="https://via.placeholder.com/150?text=Bump">Кочка (URL)</option>
        </select>
    </div>

    <div class="section">
        <h3>🌈 Цвета и Интерфейс</h3>
        <div class="flex-row">
            <div><label>Старт. экран</label><input type="color" id="startColor" value="#081022" onchange="updatePreview()"></div>
            <div><label>Фин. экран</label><input type="color" id="endColor" value="#081022" onchange="updatePreview()"></div>
        </div>
        <label>Цвет панелей и Таймера</label>
        <input type="color" id="uiColor" value="#7cf9ff" onchange="updatePreview()">
        <label><input type="checkbox" id="neonGlow" checked onchange="updatePreview()"> Неоновая подсветка</label>
        
        <label>Шрифт (цвет и размер)</label>
        <div class="flex-row">
            <input type="color" id="fontColor" value="#eaf6ff" onchange="updatePreview()">
            <input type="number" id="fontSize" value="26" onchange="updatePreview()">
        </div>
    </div>

    <div class="section">
        <h3>📢 Фидбек и Звуки</h3>
        <label>Текст победы / Провала</label>
        <input type="text" id="winMsg" value="ВЕЛИКОЛЕПНО!" oninput="updatePreview()">
        <input type="text" id="loseMsg" value="НЕ ПОВЕЗЛО..." oninput="updatePreview()">
        
        <p style="font-size:10px; opacity:0.6">* Вставьте URL своих .mp3 файлов для звуков</p>
        <label>Звук верного ответа</label>
        <input type="text" id="soundOk" placeholder="URL звука" oninput="updatePreview()">
    </div>

    <div class="section">
        <h3>🎮 Уровни (Сложность: <span id="timerVal">10</span>с)</h3>
        <input type="range" min="3" max="20" value="10" id="timeSlider" oninput="timerVal.textContent=this.value; updatePreview()">
        <div id="levelContainer"></div>
        <button class="btn" style="background:#4ecca3" onclick="addLevel()">+ Добавить уровень</button>
    </div>
</div>

<div id="preview-container">
    <div class="top-bar">
        <span>LIVE PREVIEW: Leap and Learn</span>
        <button class="btn" style="width:auto" onclick="exportCode()">СКОПИРОВАТЬ КОД ДЛЯ GITHUB</button>
    </div>
    <iframe id="game-frame"></iframe>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Редактор вопросов</h2>
        <div id="questionsList"></div>
        <button class="btn" style="margin-top:10px" onclick="addQuestion()">+ Добавить вопрос</button>
        <button class="btn" style="margin-top:20px; background:#ff3b3b; color:white" onclick="closeModal()">СОХРАНИТЬ И ЗАКРЫТЬ</button>
    </div>
</div>

<script>
    // Изначальные данные
    let currentLevelIndex = 0;
    let data = {
        levels: [
            {
                name: "Уровень 1",
                questions: [
                    {text: "I ____ ready.", answers: ["am", "is", "are"], correct: 0},
                    {text: "She ____ a cat.", answers: ["have", "has", "is"], correct: 1}
                ]
            }
        ]
    };

    function addLevel() {
        data.levels.push({
            name: "Уровень " + (data.levels.length + 1),
            questions: [{text: "Новый вопрос?", answers: ["Ответ 1", "Ответ 2", "Ответ 3"], correct: 0}]
        });
        renderLevels();
        updatePreview();
    }

    function renderLevels() {
        const container = document.getElementById('levelContainer');
        container.innerHTML = data.levels.map((l, i) => `
            <div class="level-item">
                <span><b>${l.name}</b> (${l.questions.length} вопр.)</span>
                <button class="btn btn-edit" onclick="openModal(${i})">⚙️ Вопросы</button>
            </div>
        `).join('');
    }

    // Модальное окно логика
    function openModal(idx) {
        currentLevelIndex = idx;
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('modalTitle').textContent = "Редактирование: " + data.levels[idx].name;
        renderQuestions();
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        renderLevels();
        updatePreview();
    }

    function renderQuestions() {
        const list = document.getElementById('questionsList');
        const qData = data.levels[currentLevelIndex].questions;
        list.innerHTML = qData.map((q, i) => `
            <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:10px; border-radius:10px">
                <label>Вопрос ${i+1}</label>
                <input type="text" value="${q.text}" oninput="data.levels[${currentLevelIndex}].questions[${i}].text = this.value">
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-top:5px">
                    ${q.answers.map((ans, ai) => `
                        <input type="text" value="${ans}" placeholder="Ответ ${ai+1}" 
                               oninput="data.levels[${currentLevelIndex}].questions[${i}].answers[${ai}] = this.value">
                    `).join('')}
                </div>
                <label>Индекс правильного (0, 1 или 2): 
                    <input type="number" min="0" max="2" value="${q.correct}" style="width:50px"
                           oninput="data.levels[${currentLevelIndex}].questions[${i}].correct = parseInt(this.value)">
                </label>
            </div>
        `).join('');
    }

    function addQuestion() {
        data.levels[currentLevelIndex].questions.push({text: "Новый вопрос", answers: ["1", "2", "3"], correct: 0});
        renderQuestions();
    }

    // ГЕНЕРАЦИЯ ПРЕВЬЮ
    function updatePreview() {
        const frame = document.getElementById('game-frame');
        
        // Сбор настроек из UI
        const config = {
            bg: document.getElementById('bgSelect').value,
            char: document.getElementById('charSelect').value,
            plat: document.getElementById('platformSelect').value,
            uiColor: document.getElementById('uiColor').value,
            neon: document.getElementById('neonGlow').checked,
            fontColor: document.getElementById('fontColor').value,
            fontSize: document.getElementById('fontSize').value,
            startBg: document.getElementById('startColor').value,
            endBg: document.getElementById('endColor').value,
            winT: document.getElementById('winMsg').value,
            loseT: document.getElementById('loseMsg').value,
            time: document.getElementById('timeSlider').value,
            levels: data.levels
        };

        // Формируем полный HTML-код игры (основан на твоем коде)
        const fullCode = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root { 
            --neon-main: ${config.uiColor}; 
            --bg-start: ${config.startBg};
            --bg-end: ${config.endBg};
        }
        body { margin:0; overflow:hidden; font-family:Arial; background:#000; color: ${config.fontColor}; font-size: ${config.fontSize}px; }
        #BG { position:absolute; inset:0; background:url("${config.bg}") center/cover no-repeat; z-index:0; }
        #QUESTION { position:absolute; top:30px; width:100%; text-align:center; z-index:20; text-shadow:2px 2px 4px #000; }
        #TIMER { 
            position:absolute; top:80px; left:50%; transform:translateX(-50%); 
            width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.5); border:3px solid var(--neon-main); 
            box-shadow: ${config.neon ? '0 0 20px var(--neon-main)' : 'none'};
            font-weight:bold; z-index:20;
        }
        .btn { 
            padding:15px 30px; background:var(--neon-main); border:none; border-radius:10px; 
            cursor:pointer; font-weight:bold; box-shadow: ${config.neon ? '0 0 15px var(--neon-main)' : 'none'};
        }
        #START_SCREEN { position:absolute; inset:0; z-index:100; background:var(--bg-start); display:flex; flex-direction:column; align-items:center; justify-content:center; }
        #END_SCREEN { position:absolute; inset:0; z-index:100; background:var(--bg-end); display:none; flex-direction:column; align-items:center; justify-content:center; }
        #FROG { 
            position:absolute; left:150px; bottom:20%; width:100px; height:100px; 
            background:url("${config.char}") no-repeat center/contain; z-index:15; transition: 0.5s;
        }
        .lily { 
            position:absolute; width:140px; height:140px; 
            background:url("${config.plat}") no-repeat center/contain;
            display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; cursor:pointer;
        }
        #PLATFORMS { position:absolute; inset:0; z-index:10; }
    </style>
</head>
<body>
    <div id="GAME">
        <div id="BG"></div>
        <div id="START_SCREEN">
            <h1>Leap & Learn</h1>
            <button class="btn" onclick="startGame()">▶ ИГРАТЬ</button>
        </div>
        <div id="END_SCREEN">
            <h1 id="RES_TEXT"></h1>
            <button class="btn" onclick="location.reload()">🔄 ЗАНОГО</button>
        </div>
        <div id="UI" style="display:none">
            <div id="QUESTION"></div>
            <div id="TIMER"></div>
            <div id="SCORE" style="position:absolute; top:20px; left:20px; z-index:20">⭐ 0</div>
        </div>
        <div id="FROG"></div>
        <div id="PLATFORMS"></div>
    </div>

    <script>
        const CONFIG = ${JSON.stringify(config)};
        let curLvl = 0, curQ = 0, score = 0, timer, time;

        function startGame() {
            document.getElementById('START_SCREEN').style.display = 'none';
            document.getElementById('UI').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const level = CONFIG.levels[curLvl];
            const q = level.questions[curQ];
            document.getElementById('QUESTION').textContent = q.text;
            
            const container = document.getElementById('PLATFORMS');
            container.innerHTML = "";
            
            q.answers.forEach((ans, i) => {
                const d = document.createElement('div');
                d.className = 'lily';
                d.style.left = (300 + i*200) + 'px';
                d.style.bottom = '20%';
                d.textContent = ans;
                d.onclick = () => check(i);
                container.appendChild(d);
            });

            time = CONFIG.time;
            document.getElementById('TIMER').textContent = time;
            clearInterval(timer);
            timer = setInterval(() => {
                time--;
                document.getElementById('TIMER').textContent = time;
                if(time <= 0) { clearInterval(timer); fail(); }
            }, 1000);
        }

        function check(idx) {
            if(idx === CONFIG.levels[curLvl].questions[curQ].correct) {
                score += 100;
                document.getElementById('SCORE').textContent = "⭐ " + score;
                curQ++;
                if(curQ >= CONFIG.levels[curLvl].questions.length) {
                    curLvl++; curQ = 0;
                    if(curLvl >= CONFIG.levels.length) return win();
                }
                loadQuestion();
            } else { fail(); }
        }

        function win() {
            document.getElementById('END_SCREEN').style.display = 'flex';
            document.getElementById('RES_TEXT').textContent = CONFIG.winT;
            document.getElementById('RES_TEXT').style.color = "yellow";
        }

        function fail() {
            document.getElementById('END_SCREEN').style.display = 'flex';
            document.getElementById('RES_TEXT').textContent = CONFIG.loseT;
            document.getElementById('RES_TEXT').style.color = "red";
        }
    <\/script>
</body>
</html>`;

        frame.srcdoc = fullCode;
    }

    function exportCode() {
        const code = document.getElementById('game-frame').srcdoc;
        navigator.clipboard.writeText(code);
        alert("Код игры скопирован! Теперь создай файл index.html в GitHub и вставь его туда.");
    }

    // Старт
    renderLevels();
    updatePreview();
</script>
</body>
</html>
