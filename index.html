<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Leap & Learn: Professional Builder</title>
    <style>
        :root { --p-blue: #0b1630; --p-light: #7cf9ff; --p-accent: #4ecca3; --p-panel: #161e31; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #050a18; color: white; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 520px; min-width: 520px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .tabs { display: flex; background: #1e293b; border-bottom: 1px solid #334155; }
        .tab { flex: 1; padding: 14px; text-align: center; cursor: pointer; font-size: 11px; font-weight: bold; opacity: 0.5; transition: 0.3s; border-bottom: 3px solid transparent; }
        .tab.active { opacity: 1; border-bottom-color: var(--p-light); background: rgba(124, 249, 255, 0.05); }
        
        .scroll-area { flex-grow: 1; overflow-y: auto; padding: 20px; scrollbar-width: thin; }
        .group { background: var(--p-panel); border-radius: 12px; padding: 18px; margin-bottom: 20px; border: 1px solid #232d45; }
        h4 { margin: 0 0 15px 0; color: var(--p-light); text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; }
        
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 11px; margin-bottom: 6px; color: #94a3b8; }
        input[type="text"], input[type="number"], select, textarea { 
            width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; box-sizing: border-box; font-size: 13px;
        }
        .color-row { display: flex; align-items: center; gap: 15px; }
        input[type="color"] { background: none; border: none; width: 35px; height: 35px; cursor: pointer; padding: 0; }
        
        /* Preview Zone */
        #preview-zone { flex-grow: 1; background: #000; position: relative; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }
        .top-ctrl { padding: 12px 20px; background: #0f172a; display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; }

        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--p-accent); color: #000; }
        .btn-copy { background: #fff; color: #000; }

        /* Question Editor Modal */
        #q-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; padding: 40px; }
        .modal-box { background: var(--p-panel); max-width: 1100px; margin: auto; border-radius: 20px; padding: 30px; height: 85vh; display: flex; flex-direction: column; border: 1px solid var(--p-light); }
        .qa-grid { display: flex; gap: 20px; flex: 1; min-height: 0; }
        .qa-col { flex: 1; display: flex; flex-direction: column; }
        .qa-col textarea { flex: 1; resize: none; font-family: 'Courier New', monospace; font-size: 14px; background: #050a18; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="top-ctrl">
        <span style="font-weight: 800; letter-spacing: 1px; color: var(--p-light);">LEAP & LEARN 🐸</span>
        <button class="btn btn-copy" onclick="copyFullCode()">📋 КОПИРОВАТЬ КОД</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setTab('viz')">ВИЗУАЛ</div>
        <div class="tab" onclick="setTab('hero')">ГЕРОЙ</div>
        <div class="tab" onclick="setTab('game')">ГЕЙМПЛЕЙ</div>
        <div class="tab" onclick="setTab('snd')">ЗВУК</div>
    </div>

    <div class="scroll-area">
        <div id="tab-viz" class="tab-content">
            <div class="group">
                <h4>🎨 Цвета Экранов</h4>
                <div class="field color-row">
                    <input type="color" id="c-screen-bg" value="#0b1630" oninput="upd()">
                    <label>Фон меню и финала</label>
                </div>
                <div class="field color-row">
                    <input type="color" id="c-ui-border" value="#7cf9ff" oninput="upd()">
                    <label>Цвет рамок (Таймер/Кнопки)</label>
                </div>
                <div class="field">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="neon-on" checked onchange="upd()"> Включить неоновую подсветку
                    </label>
                </div>
            </div>
            <div class="group">
                <h4>🔠 Настройка Шрифтов</h4>
                <div class="field color-row">
                    <input type="color" id="c-font-main" value="#ffffff" oninput="upd()">
                    <label>Цвет текста</label>
                </div>
                <div class="field">
                    <label>Размер текста вопроса (px)</label>
                    <input type="number" id="s-font-q" value="32" oninput="upd()">
                </div>
                <div class="field">
                    <label>Размер текста интерфейса (px)</label>
                    <input type="number" id="s-font-ui" value="18" oninput="upd()">
                </div>
            </div>
        </div>

        <div id="tab-hero" class="tab-content" style="display:none">
            <div class="group">
                <h4>🐸 Выбор персонажа</h4>
                <select id="hero-preset" onchange="heroChange(this.value)">
                    <option value="https://img.genially.com/67961b32a116fb001568a75e/3074df22-5c73-4ad2-b0b2-491c6fc247f3.png">Лягушка</option>
                    <option value="https://img.genially.com/67961b32a116fb001568a75e/74b556fcf-5354-43dd-9c9a-f50facc9a9bf.png">Хамелеон</option>
                    <option value="https://img.genially.com/67961b32a116fb001568a75e/0feda2a1-485a-4654-8640-bf1adcc9f9ec.png">Ящерица</option>
                    <option value="custom">Свой (Загрузить файл/URL)</option>
                </select>
                <div id="custom-hero-box" style="display:none; margin-top:15px;">
                    <label>Файл с компьютера</label>
                    <input type="file" accept="image/*" onchange="loadFile(this, 'hero-url')">
                    <label>Или ссылка (URL)</label>
                    <input type="text" id="hero-url" placeholder="https://..." oninput="upd()">
                </div>
            </div>
        </div>

        <div id="tab-game" class="tab-content" style="display:none">
            <div class="group">
                <h4>⚙️ Настройки Баланса</h4>
                <label>Количество жизней (сердечек)</label>
                <input type="number" id="g-lives" value="3" min="1" max="5" oninput="upd()">
                
                <label>Время на один вопрос (сек)</label>
                <input type="number" id="g-time" value="15" oninput="upd()">
            </div>
            <div class="group">
                <h4>✨ Эффекты и Комбо</h4>
                <label>Спецэффект при успехе</label>
                <select id="g-fx" onchange="upd()">
                    <option value="confetti">🎉 Конфетти</option>
                    <option value="magic">✨ Магическое сияние</option>
                    <option value="stars">⭐ Звездный дождь</option>
                    <option value="bubbles">🫧 Пузырьки</option>
                </select>
                <div class="field color-row" style="margin-top:15px;">
                    <input type="color" id="c-combo" value="#ff00ff" oninput="upd()">
                    <label>Цвет неона при КОМБО</label>
                </div>
            </div>
            <button class="btn btn-main" style="width:100%" onclick="openModal()">📝 РЕДАКТИРОВАТЬ ВОПРОСЫ</button>
        </div>

        <div id="tab-snd" class="tab-content" style="display:none">
            <div class="group">
                <h4>🎵 Звуковая библиотека (URL или файл)</h4>
                <div class="field">
                    <label>Верно ✅</label>
                    <input type="text" id="s-ok" placeholder="Ссылка на mp3..." oninput="upd()">
                </div>
                <div class="field">
                    <label>Ошибка ❌</label>
                    <input type="text" id="s-no" placeholder="Ссылка на mp3..." oninput="upd()">
                </div>
                <div class="field">
                    <label>Победа (Федбек) 🏆</label>
                    <input type="text" id="s-win" placeholder="Ссылка на mp3..." oninput="upd()">
                </div>
                <div class="field">
                    <label>Проигрыш (Федбек) 💀</label>
                    <input type="text" id="s-lose" placeholder="Ссылка на mp3..." oninput="upd()">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="preview-zone">
    <iframe id="game-preview"></iframe>
</div>

<div id="q-modal">
    <div class="modal-box">
        <h2>Редактор вопросов и ответов</h2>
        <div class="qa-grid">
            <div class="qa-col">
                <label>Вопросы (один в строке)</label>
                <textarea id="raw-q" placeholder="What is 2+2?"></textarea>
            </div>
            <div class="qa-col">
                <label>Ответы (Правильный | Ложный | Ложный)</label>
                <textarea id="raw-a" placeholder="4 | 2 | 22"></textarea>
            </div>
        </div>
        <button class="btn btn-main" style="margin-top:20px" onclick="saveQuestions()">СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
    </div>
</div>

<script>
    let gameData = {
        q: ["How are you?", "2 + 2 ="],
        a: ["Fine | Bad | Sad", "4 | 5 | 1"]
    };

    function setTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + id).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    function heroChange(val) {
        document.getElementById('custom-hero-box').style.display = (val === 'custom') ? 'block' : 'none';
        upd();
    }

    function loadFile(input, targetId) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { document.getElementById(targetId).value = e.target.result; upd(); };
        reader.readAsDataURL(file);
    }

    function openModal() {
        document.getElementById('raw-q').value = gameData.q.join('\n');
        document.getElementById('raw-a').value = gameData.a.join('\n');
        document.getElementById('q-modal').style.display = 'flex';
    }

    function saveQuestions() {
        gameData.q = document.getElementById('raw-q').value.split('\n').filter(x => x.trim());
        gameData.a = document.getElementById('raw-a').value.split('\n').filter(x => x.trim());
        document.getElementById('q-modal').style.display = 'none';
        upd();
    }

    function upd() {
        const frame = document.getElementById('game-preview');
        const cfg = {
            screenBg: document.getElementById('c-screen-bg').value,
            borderColor: document.getElementById('c-ui-border').value,
            neon: document.getElementById('neon-on').checked,
            fontColor: document.getElementById('c-font-main').value,
            qSize: document.getElementById('s-font-q').value,
            uiSize: document.getElementById('s-font-ui').value,
            hero: document.getElementById('hero-preset').value === 'custom' ? document.getElementById('hero-url').value : document.getElementById('hero-preset').value,
            lives: document.getElementById('g-lives').value,
            time: document.getElementById('g-time').value,
            fx: document.getElementById('g-fx').value,
            combo: document.getElementById('c-combo').value,
            sfx: {
                ok: document.getElementById('s-ok').value,
                no: document.getElementById('s-no').value,
                win: document.getElementById('s-win').value,
                lose: document.getElementById('s-lose').value
            },
            data: gameData
        };

        const html = `
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                body { margin:0; background:${cfg.screenBg}; color:${cfg.fontColor}; font-family:sans-serif; overflow:hidden; }
                #UI { position:absolute; top:20px; left:20px; display:flex; gap:20px; font-size:${cfg.uiSize}px; z-index:10; }
                .box { 
                    padding:10px 20px; border:2px solid ${cfg.borderColor}; border-radius:10px;
                    box-shadow: ${cfg.neon ? '0 0 15px '+cfg.borderColor : 'none'};
                    background: rgba(0,0,0,0.5);
                }
                #question { position:absolute; top:18%; width:100%; text-align:center; font-size:${cfg.qSize}px; padding:0 50px; box-sizing:border-box; }
                #hero { 
                    position:absolute; bottom:15%; left:10%; width:120px; height:120px;
                    background:url('${cfg.hero}') center/contain no-repeat;
                    transition: 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
                }
                .plats { position:absolute; bottom:15%; width:100%; display:flex; justify-content:center; gap:60px; }
                .p { width:150px; height:150px; background:rgba(255,255,255,0.1); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold; }
            </style>
        </head>
        <body>
            <div id="UI">
                <div class="box">❤️ <span id="l">${cfg.lives}</span></div>
                <div class="box">⏱️ <span id="t">${cfg.time}</span></div>
                <div class="box">⭐ <span id="s">0</span></div>
            </div>
            <div id="question">ПРЕВЬЮ: ${cfg.data.q[0]}</div>
            <div id="hero"></div>
            <div class="plats" id="pc"></div>
            <script>
                const answers = "${cfg.data.a[0]}".split('|');
                const pc = document.getElementById('pc');
                answers.forEach(text => {
                    const d = document.createElement('div');
                    d.className = 'p'; d.innerText = text.trim();
                    pc.appendChild(d);
                });
            <\/script>
        </body>
        </html>`;
        frame.srcdoc = html;
    }

    function copyFullCode() {
        const code = document.getElementById('game-preview').srcdoc;
        navigator.clipboard.writeText(code);
        alert("Код игры успешно скопирован!");
    }

    upd();
</script>
</body>
</html>
