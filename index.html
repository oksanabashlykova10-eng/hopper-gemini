<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Leap & Learn Professional Editor</title>
    <style>
        :root { --accent: #4ecca3; --bg: #0b1630; --panel: #16213e; --danger: #ff4757; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }
        
        /* Стили Сайдбара (Редактора) */
        #sidebar { width: 450px; min-width: 450px; background: var(--panel); padding: 20px; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.1); box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        .section { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        h3 { margin: 0 0 15px; color: var(--accent); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; font-size: 12px; margin-bottom: 5px; opacity: 0.8; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: #1a2a4a; color: white; box-sizing: border-box; margin-bottom: 15px; font-size: 14px; }
        input[type="color"] { height: 40px; cursor: pointer; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); }
        .btn-add { background: #45b39d; margin-top: 10px; }
        .btn-danger { background: var(--danger); color: white; }

        /* Превью */
        #preview-container { flex-grow: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .header-bar { padding: 10px 20px; background: #0f1a35; display: flex; justify-content: space-between; align-items: center; }
        #game-frame { width: 100%; height: 100%; border: none; background: #000; }

        /* Модалка уровней */
        #q-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 40px; }
        .modal-box { background: var(--panel); width: 100%; max-width: 800px; max-height: 85vh; overflow-y: auto; padding: 30px; border-radius: 20px; border: 1px solid var(--accent); }
        .level-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
        
        .answer-hint { font-size: 11px; color: var(--accent); margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="margin:0 0 20px; display:flex; align-items:center; gap:10px;">🐸 Leap & Learn Editor</h2>

    <div class="section">
        <h3>📍 Локация и Платформы</h3>
        <label>Фон игры</label>
        <select id="bg-select" onchange="toggleCustomBg(this.value)">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/c0c9010f-c3dd-42c1-b7c1-65024fa3aec6.png">Река (Синий)</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/fa2ab459-fec9-4ccd-97e3-254427b4ade0.png">Лава (Красный)</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/02b52ad4-9d31-4b21-a305-8fec6e8a4487.png">Болото (Зеленый)</option>
            <option value="custom">Загрузить свой URL...</option>
        </select>
        <input type="text" id="bg-custom" placeholder="Вставьте ссылку на картинку" style="display:none" oninput="updatePreview()">

        <label>Платформа</label>
        <select id="platform-select" onchange="updatePreview()">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/ed6c6e82-953b-43d4-947d-e46227b760f0.png">Лилия</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/bad37c6d-f04c-45c0-b954-807d79ec3a95.png">Камень</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/c6775617-bde5-43e4-9da8-5332d928807e.png">Кочка</option>
        </select>
    </div>

    <div class="section">
        <h3>👤 Персонаж и UI</h3>
        <label>Герой</label>
        <select id="hero-select" onchange="updatePreview()">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/3074df22-5c73-4ad2-b0b2-491c6fc247f3.png">Лягушка</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/74b56fcf-5354-43dd-9c9a-f50facc9a9bf.png">Хамелеон</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/0feda2a1-485a-4654-8640-bf1adcc9f9ec.png">Ящерица</option>
        </select>

        <div class="flex-row">
            <div style="flex:1">
                <label>Цвет панелей</label>
                <input type="color" id="color-ui" value="#7cf9ff" oninput="updatePreview()">
            </div>
            <div style="flex:1; padding-top:20px;">
                <input type="checkbox" id="neon-toggle" checked onchange="updatePreview()"> Неон
            </div>
        </div>

        <div class="flex-row">
            <div style="flex:1">
                <label>Цвет шрифта</label>
                <input type="color" id="color-font" value="#0b1630" oninput="updatePreview()">
            </div>
            <div style="flex:1">
                <label>Размер шрифта</label>
                <input type="number" id="font-size" value="26" min="10" max="50" oninput="updatePreview()">
            </div>
        </div>
    </div>

    <div class="section">
        <h3>📢 Тексты и Финалы</h3>
        <label>Начальный/Конечный фон</label>
        <input type="color" id="color-screens" value="#0a1730" oninput="updatePreview()">
        
        <label>Текст Победы</label>
        <input type="text" id="txt-win" value="ВЕЛИКОЛЕПНО!" oninput="updatePreview()">
        
        <label>Текст Проигрыша</label>
        <input type="text" id="txt-lose" value="НЕ ПОВЕЗЛО..." oninput="updatePreview()">
    </div>

    <div class="section">
        <h3>🎮 Уровни и Сложность</h3>
        <label>Время на ответ (сек)</label>
        <input type="range" id="diff-range" min="3" max="30" value="10" oninput="document.getElementById('diff-val').innerText=this.value; updatePreview()">
        <div style="text-align:right; font-size:12px; margin-top:-10px; margin-bottom:10px;">Текущая: <span id="diff-val">10</span>с</div>
        
        <div id="levels-list"></div>
        <button class="btn btn-add" onclick="addLevel()">+ Добавить уровень</button>
    </div>

    <button class="btn" style="margin-top:20px; background:#fff;" onclick="copyCode()">📋 СКОПИРОВАТЬ КОД ДЛЯ GITHUB</button>
</div>

<div id="preview-container">
    <div class="header-bar">
        <span>Предпросмотр: Leap & Learn</span>
        <span style="font-size:11px; opacity:0.6;">Автоматическое обновление</span>
    </div>
    <iframe id="game-frame"></iframe>
</div>

<div id="q-modal">
    <div class="modal-box">
        <h2 id="modal-title">Вопросы уровня</h2>
        <div id="questions-container"></div>
        <button class="btn btn-add" onclick="addQuestionToActiveLevel()">+ Добавить вопрос</button>
        <button class="btn" style="margin-top:20px;" onclick="closeModal()">Сохранить и закрыть</button>
    </div>
</div>

<script>
    let levels = [
        { name: "Уровень 1", questions: [{ text: "I ___ ready.", answers: "am/is/are" }] }
    ];
    let activeLevelIdx = 0;

    function toggleCustomBg(val) {
        document.getElementById('bg-custom').style.display = (val === 'custom') ? 'block' : 'none';
        updatePreview();
    }

    function addLevel() {
        levels.push({ name: `Уровень ${levels.length + 1}`, questions: [{ text: "Новый вопрос", answers: "Правильный/Ложный/Ложный" }] });
        renderLevels();
        updatePreview();
    }

    function removeLevel(idx) {
        if(levels.length > 1) {
            levels.splice(idx, 1);
            renderLevels();
            updatePreview();
        }
    }

    function renderLevels() {
        const cont = document.getElementById('levels-list');
        cont.innerHTML = '';
        levels.forEach((lvl, i) => {
            const div = document.createElement('div');
            div.className = 'level-card';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <input type="text" value="${lvl.name}" style="width:150px; margin:0; background:transparent; border:none;" oninput="levels[${i}].name=this.value">
                    <div style="display:flex; gap:5px;">
                        <button class="btn btn-sm" style="padding:5px 10px;" onclick="openModal(${i})">⚙️ Вопросы (${lvl.questions.length})</button>
                        <button class="btn btn-danger" style="padding:5px 10px;" onclick="removeLevel(${i})">✕</button>
                    </div>
                </div>
            `;
            cont.appendChild(div);
        });
    }

    function openModal(idx) {
        activeLevelIdx = idx;
        document.getElementById('modal-title').innerText = levels[idx].name;
        renderQuestions();
        document.getElementById('q-modal').style.display = 'flex';
    }

    function renderQuestions() {
        const cont = document.getElementById('questions-container');
        cont.innerHTML = '';
        levels[activeLevelIdx].questions.forEach((q, i) => {
            const div = document.createElement('div');
            div.style.marginBottom = "20px";
            div.innerHTML = `
                <label>Вопрос #${i+1}</label>
                <input type="text" value="${q.text}" oninput="levels[${activeLevelIdx}].questions[${i}].text=this.value">
                <div class="answer-hint">Формат: Правильный/Ложный/Ложный</div>
                <input type="text" value="${q.answers}" placeholder="Ответ1/Ответ2/Ответ3" oninput="levels[${activeLevelIdx}].questions[${i}].answers=this.value">
                <button class="btn btn-danger" style="width:auto; padding:5px 15px;" onclick="levels[${activeLevelIdx}].questions.splice(${i},1); renderQuestions()">Удалить вопрос</button>
                <hr style="opacity:0.1; margin-top:20px;">
            `;
            cont.appendChild(div);
        });
    }

    function addQuestionToActiveLevel() {
        levels[activeLevelIdx].questions.push({ text: "", answers: "Верно/Неверно/Неверно" });
        renderQuestions();
    }

    function closeModal() {
        document.getElementById('q-modal').style.display = 'none';
        renderLevels();
        updatePreview();
    }

    function updatePreview() {
        const frame = document.getElementById('game-frame');
        
        // Сбор настроек
        const config = {
            bg: document.getElementById('bg-select').value === 'custom' ? document.getElementById('bg-custom').value : document.getElementById('bg-select').value,
            platform: document.getElementById('platform-select').value,
            hero: document.getElementById('hero-select').value,
            uiColor: document.getElementById('color-ui').value,
            neon: document.getElementById('neon-toggle').checked,
            fontColor: document.getElementById('color-font').value,
            fontSize: document.getElementById('font-size').value,
            screenBg: document.getElementById('color-screens').value,
            winTxt: document.getElementById('txt-win').value,
            loseTxt: document.getElementById('txt-lose').value,
            time: parseInt(document.getElementById('diff-range').value),
            levels: JSON.parse(JSON.stringify(levels))
        };

        // Трансформация ответов для движка
        config.levels.forEach(lvl => {
            lvl.questions.forEach(q => {
                const parts = q.answers.split('/').map(a => a.trim());
                q.answers = parts;
                q.correct = 0; // Первый всегда правильный в строке, движок перемешает
            });
        });

        // Генерация HTML (здесь вставляется твой движок с подставленными переменными)
        const finalHTML = `
        <!DOCTYPE html>
        <html>
        <head>
            <style>
                :root { 
                    --neon: ${config.uiColor}; 
                    --font-c: ${config.fontColor};
                    --font-s: ${config.fontSize}px;
                }
                body, html { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif; background: ${config.screenBg}; }
                #GAME { position: relative; width: 100vw; height: 100vh; background: url('${config.bg}') center/cover; }
                #UI_PANEL { 
                    position: absolute; top: 20px; left: 20px; 
                    padding: 10px 20px; border-radius: 15px;
                    background: rgba(255,255,255,0.9);
                    border: 2px solid var(--neon);
                    box-shadow: ${config.neon ? '0 0 15px var(--neon)' : 'none'};
                    color: #000; font-weight: bold;
                }
                #Q_TEXT {
                    position: absolute; top: 10%; width: 100%; text-align: center;
                    font-size: var(--font-s); color: var(--font-c);
                    background: rgba(255,255,255,0.7); padding: 10px 0;
                }
                .lily { 
                    position: absolute; width: 150px; height: 150px; 
                    background: url('${config.platform}') no-repeat center/contain;
                    display: flex; align-items: center; justify-content: center;
                    font-weight: bold; cursor: pointer; transition: 0.3s;
                }
                .lily:hover { transform: scale(1.1); }
                #HERO {
                    position: absolute; width: 100px; height: 100px;
                    background: url('${config.hero}') no-repeat center/contain;
                    bottom: 20%; left: 50px; z-index: 5; transition: 0.5s;
                }
                #SCREEN {
                    position: fixed; inset: 0; background: ${config.screenBg};
                    display: flex; flex-direction: column; align-items: center; justify-content: center;
                    z-index: 100; color: white; text-align: center;
                }
                .btn { padding: 15px 40px; background: var(--neon); border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
            </style>
        </head>
        <body>
            <div id="SCREEN">
                <h1 id="SCREEN_TITLE">Leap & Learn</h1>
                <button class="btn" onclick="startGame()">НАЧАТЬ ИГРУ</button>
            </div>
            <div id="GAME">
                <div id="UI_PANEL">⭐ <span id="SCORE">0</span> | ⏱️ <span id="TIMER">${config.time}</span></div>
                <div id="Q_TEXT">Загрузка...</div>
                <div id="HERO"></div>
                <div id="PLATFORMS"></div>
            </div>

            <script>
                const CONFIG = ${JSON.stringify(config)};
                let currentLevel = 0;
                let currentQ = 0;
                let score = 0;
                let timer;

                function startGame() {
                    document.getElementById('SCREEN').style.display = 'none';
                    loadQuestion();
                }

                function loadQuestion() {
                    const qData = CONFIG.levels[currentLevel].questions[currentQ];
                    document.getElementById('Q_TEXT').innerText = qData.text;
                    
                    const container = document.getElementById('PLATFORMS');
                    container.innerHTML = '';
                    
                    // Перемешивание ответов
                    const answers = qData.answers.map((text, i) => ({ text, correct: i === 0 }));
                    answers.sort(() => Math.random() - 0.5);

                    answers.forEach((ans, i) => {
                        const div = document.createElement('div');
                        div.className = 'lily';
                        div.style.left = (250 + i * 200) + 'px';
                        div.style.bottom = '20%';
                        div.innerText = ans.text;
                        div.onclick = () => check(ans.correct);
                        container.appendChild(div);
                    });
                }

                function check(isCorrect) {
                    if(isCorrect) {
                        score += 100;
                        document.getElementById('SCORE').innerText = score;
                        next();
                    } else {
                        end(false);
                    }
                }

                function next() {
                    currentQ++;
                    if(currentQ >= CONFIG.levels[currentLevel].questions.length) {
                        currentLevel++;
                        currentQ = 0;
                        if(currentLevel >= CONFIG.levels.length) return end(true);
                    }
                    loadQuestion();
                }

                function end(win) {
                    const scr = document.getElementById('SCREEN');
                    scr.style.display = 'flex';
                    document.getElementById('SCREEN_TITLE').innerText = win ? CONFIG.winTxt : CONFIG.loseTxt;
                    scr.innerHTML += '<button class="btn" onclick="location.reload()">ЗАНОГО</button>';
                }
            <\/script>
        </body>
        </html>
        `;
        
        frame.srcdoc = finalHTML;
    }

    function copyCode() {
        const code = document.getElementById('game-frame').srcdoc;
        navigator.clipboard.writeText(code);
        alert("Код игры скопирован! Создайте файл index.html и вставьте его туда.");
    }

    renderLevels();
    updatePreview();
</script>
</body>
</html>
