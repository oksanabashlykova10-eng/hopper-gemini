function waterFX(bubbles=false){ const x=160, y=innerHeight/2+64; const s=document.createElement("div"); s.className="splash"; s.style.left=(x-45)+"px"; s.style.top=(y-17)+"px"; FX.appendChild(s); setTimeout(()=>s.remove(),520); for(let i=0;i<3;i++){ const r=document.createElement("div"); r.className="ripple"; const size=64+i*40; r.style.width=r.style.height=size+"px"; r.style.left=(x-size/2)+"px"; r.style.top=(y-size/2)+"px"; FX.appendChild(r); setTimeout(()=>r.remove(),1550); } if(bubbles){ for(let i=0;i<20;i++){ const b=document.createElement("div"); b.className="bubble"; const ss=6+Math.random()*12; b.style.width=b.style.height=ss+"px"; b.style.left=(x + Math.random()*140 - 70)+"px"; b.style.top=(y + Math.random()*34 - 17)+"px"; b.style.setProperty("--dx",(Math.random()*140-70)+"px"); b.style.setProperty("--dy",(-140-Math.random()*120)+"px"); FX.appendChild(b); setTimeout(()=>b.remove(),1750); } } }
function confettiBurst(power=1){ const count=Math.floor(180*power); for(let i=0;i<count;i++){ const c=document.createElement("div"); c.className="confetti"; const x=Math.random()*innerWidth; c.style.left=x+"px"; c.style.top=(-30 - Math.random()*200)+"px"; c.style.setProperty("--dx",(Math.random()*420-210)+"px"); c.style.background ="hsla("+Math.random()*360+", 98%, 62%, .99)"; FX.appendChild(c); setTimeout(()=>c.remove(),2700); } }
function sparkBurst(cx,cy, power=1){ const n=Math.floor(64*power); for(let i=0;i<n;i++){ const sp=document.createElement("div"); sp.className="spark"; sp.style.left=(cx-4)+"px"; sp.style.top=(cy-4)+"px"; sp.style.setProperty("--dx",(Math.random()*520-260)+"px"); sp.style.setProperty("--dy",(Math.random()*-360-40)+"px"); sp.style.background ="hsla("+Math.random()*360+", 98%, 72%, .99)"; FX.appendChild(sp); setTimeout(()=>sp.remove(),1100); } }
function comboEnergyFX(strength=1){ const r=FROG.getBoundingClientRect(); const cx=r.left+r.width*.5, cy=r.top+r.height*.56; const count=Math.floor(14+strength*10); for(let i=0;i<count;i++){ const p=document.createElement("div"); p.className="goldSpark"; p.style.left=(cx+(Math.random()*40-20))+"px"; p.style.top=(cy+(Math.random()*36-18))+"px"; p.style.setProperty("--dx",(Math.random()*220-110)*(.45+strength*.15)+"px"); p.style.setProperty("--dy",(Math.random()*-180-30)*(.55+strength*.12)+"px"); FX.appendChild(p); setTimeout(()=>p.remove(),900); } }
function showComboAura(){ const c=combo; const strength=Math.min(1.0, 0.45+c*.12); const dur=Math.min(1000, 600+c*80); const blur1=Math.min(46, 18+c*6), blur2=Math.min(92, 40+c*10), scale=Math.min(1.35, 1.02+c*.04), opacity=Math.min(0.95, 0.55+c*.08); FROG.style.setProperty("--auraBlur1", blur1+"px"); FROG.style.setProperty("--auraBlur2", blur2+"px"); FROG.style.setProperty("--auraScale", scale); FROG.style.setProperty("--auraOpacity", opacity); FROG.classList.remove("aura"); void FROG.offsetWidth; FROG.classList.add("aura"); setTimeout(()=>FROG.classList.remove("aura"), dur); comboEnergyFX(strength); turboSound(0.75+strength*0.55); cameraKick(0.55+strength*0.35); }
function frogJump(){FROG.classList.add("jump");setTimeout(()=>FROG.classList.remove("jump"),300)}
function cameraShake(){GAME.classList.add("shake");setTimeout(()=>GAME.classList.remove("shake"),300)}
function fmt(s){ return "00:"+String(s).padStart(2,"0"); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randomizeQuestion(qObj){ const packs=qObj.answers.map((txt,idx)=>({txt, idx})); const shuffled=shuffle(packs); return { text:qObj.text, answers:shuffled.map(x=>x.txt), correct:shuffled.findIndex(x=>x.idx===qObj.correct) }; }
function totalQuestionsInAllLevels(){ return LEVELS.reduce((s,l)=>s+(l.questions?.length||0),0); }
function getRoundTime(){ const d=DIFF_PRESETS[diffKey] || DIFF_PRESETS.classic; if(correctCount<3) return d.t1; if(correctCount<6) return d.t2; return d.t3; }
function comboMultiplier(){ return Math.min(2.0, Math.round((1+combo*0.12)*10)/10); }
function updateComboUI(){ if(combo<=0){ COMBO_UI.classList.remove("show","pulse","shine"); return; } COMBO_UI.classList.add("show","pulse","shine"); setTimeout(()=>COMBO_UI.classList.remove("pulse"), 560); COMBO_TXT.textContent="COMBO x"+comboMultiplier().toFixed(1); }
function startTimer(){ clearInterval(timer); timeLeft=getRoundTime(); T.classList.remove("danger"); T_TXT.textContent=fmt(timeLeft); timer=setInterval(()=>{ timeLeft--; if(timeLeft<=0){ clearInterval(timer); fail("time"); return; } T_TXT.textContent=fmt(timeLeft); if(timeLeft<=3){ T.classList.add("danger"); tickSound(); } else T.classList.remove("danger"); },1000); }
`;

    // Часть 2 (твоя "хвостовая" часть)
    const engineStep2 = `
function buildQuestionsForLevel(idx){
  const lvl = LEVELS[idx] || LEVELS[0];
  const randomized = (lvl.questions||[]).map(q=>randomizeQuestion(q));
  QUESTIONS = shuffle(randomized);
}

function render(){
  locked=!started; P.innerHTML=""; FROG.classList.remove("sink");
  Q_TXT.textContent=QUESTIONS[q]?.text || "";
  L.textContent="❤️".repeat(lives); S.textContent="⭐ "+score;
  updateComboUI();
  const STEP=190, y=innerHeight/2 + 76;
  const count=Math.ceil((innerWidth-160)/STEP)+4;
  for(let i=0;i<count;i++){
    const d=document.createElement("div"); d.className="platform";
    d.style.left=160+STEP*i-75+"px"; d.style.top=y-75+"px";
    const lily=document.createElement("div"); lily.className="lily";
    if(i>0 && QUESTIONS[q] && i<=QUESTIONS[q].answers.length){
      lily.textContent=QUESTIONS[q].answers[i-1];
      d.classList.add("answer"); d.onclick=()=>pick(i,d);
    }
    d.appendChild(lily); P.appendChild(d);
  }
}

function pick(i,el){
  if(!started||locked) return;
  locked=true; clearInterval(timer); frogJump();
  document.querySelectorAll(".platform").forEach(p=>p.style.transform="translateX("+(-(el.offsetLeft+75-160))+"px)");
  setTimeout(()=>{
    const isCorrect = (i-1===QUESTIONS[q].correct);
    if(isCorrect){
      okSound(); waterFX(false);
      const basePts = BASE, timePts = timeLeft*MULT;
      baseSum += basePts; timeBonusSum += timePts;
      combo++; maxCombo = Math.max(maxCombo, combo);
      const mult = comboMultiplier();
      const comboBonus = Math.round((basePts + timePts) * (mult-1));
      comboBonusSum += comboBonus;
      score += basePts + timePts + comboBonus;
      correctCount++;
      if(combo>=2){ comboJoySound(); showComboAura(); }
      sparkBurst(innerWidth/2, innerHeight*0.35, 0.9);
      q++;
      if(q>=QUESTIONS.length) showEnd(true);
      else startRound();
    }else{ fail("wrong"); }
  },500);
}

function fail(reason){
  lives--; if(combo>0) combo=0; updateComboUI();
  const penalty = WRONG_PENALTY; penaltySum += penalty;
  score = Math.max(0, score - penalty);
  FROG.classList.remove("aura"); waterFailSound(); waterFX(true); cameraShake(); FROG.classList.add("sink");
  document.querySelectorAll(".platform").forEach(p=>{
    p.classList.add("fade","wrong","wobble");
    setTimeout(()=>p.classList.remove("wobble"), 900);
  });
  setTimeout(()=>{ lives<=0 ? showEnd(false) : startRound(); },900);
}

function startRound(){ locked=false; render(); startTimer(); }
function fillLevelTable(){
  const done = Math.min(q, QUESTIONS.length);
  STAT_Q.textContent = done+"/"+QUESTIONS.length;
  STAT_L.textContent = "❤️" + lives;
  STAT_B.textContent = "⭐ " + baseSum;
  STAT_T.textContent = "⭐ " + timeBonusSum;
  STAT_C.textContent = "⭐ " + comboBonusSum;
  STAT_P.textContent = "⭐ " + penaltySum;
  FINAL_SCORE.textContent="⭐ Score: "+score;
}

function pushLevelToGrand(){
  grandScore += score; grandBase += baseSum; grandTime += timeBonusSum;
  grandCombo += comboBonusSum; grandPenalty += penaltySum; grandDone += Math.min(q, QUESTIONS.length);
}

function showTotalResults(){
  LEVEL_BANNER.textContent = "TOTAL RESULTS"; LEVEL_NAME.textContent = "Game Completed"; HINT_LINE.textContent = "";
  END_TEXT.textContent = "GAME COMPLETED!"; END_TEXT.className = "win";
  STAT_Q.textContent = grandDone+"/"+grandTotal; STAT_L.textContent = "❤️" + lives;
  STAT_B.textContent = "⭐ " + grandBase; STAT_T.textContent = "⭐ " + grandTime;
  STAT_C.textContent = "⭐ " + grandCombo; STAT_P.textContent = "⭐ " + grandPenalty;
  FINAL_SCORE.textContent = "⭐ Score: " + grandScore;
  NEXT_LEVEL.style.display="none"; FINISH.textContent = "🏠 Back to Menu";
  playTotalSound(); confettiBurst(1.8); sparkBurst(innerWidth/2, innerHeight*0.22, 1.7);
}

function showEnd(win){
  clearInterval(timer); END.classList.add("show");
  const lvlName = (LEVELS[levelIndex]?.name) || "Level "+(levelIndex+1);
  LEVEL_NAME.textContent = campaignMode ? lvlName+" (Campaign)" : lvlName;
  finishStage=0; FINISH.textContent="🏁 Finish";
  const last = (levelIndex >= LEVELS.length-1);
  if(win){
    END_TEXT.textContent="CONGRATULATIONS!"; END_TEXT.className="win";
    LEVEL_BANNER.textContent="LEVEL COMPLETE"; playWinSound(); confettiBurst(1.2);
    if(campaignMode && last){ campaignCompleted=true; HINT_LINE.textContent = "All levels cleared — press Finish for Total Results"; NEXT_LEVEL.style.display="none"; }
    else { campaignCompleted=false; HINT_LINE.textContent = ""; NEXT_LEVEL.style.display = (last ? "none" : "inline-block"); }
  } else {
    END_TEXT.textContent="YOU LOST!"; END_TEXT.className="lose"; LEVEL_BANNER.textContent="TRY AGAIN";
    campaignCompleted=false; NEXT_LEVEL.style.display="none"; loseFinalSound();
  }
  fillLevelTable();
}

function resetState(){
  q=0; lives=LIVES_START; score=0; started=false; locked=false; baseSum=0; timeBonusSum=0; comboBonusSum=0; penaltySum=0; correctCount=0; combo=0; maxCombo=0; clearInterval(timer);
  END.classList.remove("show"); COMBO_UI.classList.remove("show"); T.classList.remove("danger");
  FROG.classList.remove("aura"); campaignCompleted=false; FINISH.textContent="🏁 Finish";
}

function startLevel(idx){
  levelIndex = Math.max(0, Math.min(LEVELS.length-1, idx));
  buildQuestionsForLevel(levelIndex); resetState(); START_SCREEN.style.display="none";
  started=true; render(); startRound();
}

function startCampaign(){
  campaignMode=true; levelIndex=0; grandScore=0; grandBase=0; grandTime=0; grandCombo=0; grandPenalty=0; grandDone=0;
  grandTotal = totalQuestionsInAllLevels(); startLevel(0);
}

DIFF.onchange=()=>{ diffKey = DIFF.value; if(!started) T_TXT.textContent = fmt(getRoundTime()); };
START_BTN.onclick=()=>{ ctx.resume(); startCampaign(); };
RETRY.onclick=()=>{ resetState(); campaignMode=false; START_SCREEN.style.display="flex"; render(); };
NEXT_LEVEL.onclick=()=>{ ctx.resume(); if(campaignMode) pushLevelToGrand(); startLevel(levelIndex+1); };
FINISH.onclick=()=>{ ctx.resume(); if(campaignMode && campaignCompleted && finishStage===0){ pushLevelToGrand(); finishStage=1; showTotalResults(); return; } resetState(); campaignMode=false; START_SCREEN.style.display="flex"; render(); };
window.addEventListener("resize", ()=>{ if(started && !END.classList.contains("show")) render(); });
diffKey = DIFF.value; T_TXT.textContent = fmt(getRoundTime()); render();
<\/script>
</body>
</html>
`;

    function updatePreview() {
        const bg = document.getElementById('asset-bg').value;
        const lily = document.getElementById('asset-lily').value;
        const levelsStr = JSON.stringify(gameConfig.levels);
        
        let fullHTML = engineStep1
            .replace('ASSET_BG', bg)
            .replace('ASSET_LILY', lily)
            .replace('CONFIG_LEVELS', levelsStr)
            + engineStep2;
            
        document.getElementById('game-preview').srcdoc = fullHTML;
    }

    function renderLevelsList() {
        const cont = document.getElementById('levels-container');
        cont.innerHTML = gameConfig.levels.map((l, i) => `
            <div class="level-item">
                <span style="font-weight:bold">${l.name} (${l.questions.length} Q)</span>
                <div>
                    <button class="btn btn-sm" onclick="editQuestions(${i})">⚙️ Вопросы</button>
                    <button class="btn btn-sm" style="background:var(--danger); color:white" onclick="removeLevel(${i})">✕</button>
                </div>
            </div>
        `).join('');
    }

    function addLevel() {
        gameConfig.levels.push({
            name: "Level " + (gameConfig.levels.length + 1),
            questions: [{text: "New Question?", answers: ["Yes", "No", "Maybe"], correct: 0}]
        });
        renderLevelsList();
        updatePreview();
    }

    function removeLevel(idx) {
        if(gameConfig.levels.length > 1) {
            gameConfig.levels.splice(idx, 1);
            renderLevelsList();
            updatePreview();
        }
    }

    function editQuestions(idx) {
        activeLevelIdx = idx;
        document.getElementById('modal-lvl-name').innerText = gameConfig.levels[idx].name;
        renderQuestions();
        document.getElementById('q-modal').style.display = 'flex';
    }

    function renderQuestions() {
        const cont = document.getElementById('questions-list');
        const qs = gameConfig.levels[activeLevelIdx].questions;
        cont.innerHTML = qs.map((q, i) => `
            <div class="q-card">
                <input type="text" value="${q.text}" placeholder="Вопрос" oninput="gameConfig.levels[${activeLevelIdx}].questions[${i}].text=this.value">
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px;">
                    <input type="text" value="${q.answers[0]}" oninput="gameConfig.levels[${activeLevelIdx}].questions[${i}].answers[0]=this.value">
                    <input type="text" value="${q.answers[1]}" oninput="gameConfig.levels[${activeLevelIdx}].questions[${i}].answers[1]=this.value">
                    <input type="text" value="${q.answers[2]}" oninput="gameConfig.levels[${activeLevelIdx}].questions[${i}].answers[2]=this.value">
                </div>
                <select onchange="gameConfig.levels[${activeLevelIdx}].questions[${i}].correct=parseInt(this.value)">
                    <option value="0" ${q.correct==0?'selected':''}>Правильный: Вариант 1</option>
                    <option value="1" ${q.correct==1?'selected':''}>Правильный: Вариант 2</option>
                    <option value="2" ${q.correct==2?'selected':''}>Правильный: Вариант 3</option>
                </select>
                <button class="btn btn-sm" style="background:var(--danger); color:white; width:100%" onclick="gameConfig.levels[${activeLevelIdx}].questions.splice(${i},1); renderQuestions()">Удалить вопрос</button>
            </div>
        `).join('');
    }

    function addQuestion() {
        gameConfig.levels[activeLevelIdx].questions.push({text:"", answers:["","",""], correct:0});
        renderQuestions();
    }

    function closeModal() {
        document.getElementById('q-modal').style.display = 'none';
        renderLevelsList();
        updatePreview();
    }

    function copyFullCode() {
        const code = document.getElementById('game-preview').srcdoc;
        navigator.clipboard.writeText(code);
        alert("Код игры скопирован! Теперь вставь его в .html файл.");
    }

    renderLevelsList();
    updatePreview();
</script>
</body>
</html>
