<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Leap & Learn: Ultimate Editor</title>
<style>
/* --- CSS VARIABLES & RESET --- */
:root {
  --neon-main: #7cf9ff;
  --neon-sec: #d400ff;
  --danger: #ff3b3b;
  --win: #ffe44d;
  --bg: #0a1730;
  --panel: rgba(10,23,48,0.95);
  --glass: rgba(255,255,255,0.1);
  --font-main: 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-main); background: var(--bg); color: #fff; }

/* --- GAME VIEW --- */
#GAME { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
#BG { position: absolute; inset: 0; z-index: 0; background: url("https://img.genially.com/67961b32a116fb001568a75e/c0c9010f-c3dd-4286-9818-a68158d68962.jpeg") center/cover no-repeat; opacity: 0.6; pointer-events: none; transition: filter 0.5s; }
canvas { display: block; width: 100%; flex: 1; z-index: 1; position: relative; }

/* UI LAYERS */
#UI_LAYER { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
.top-bar { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
.score-box { background: var(--panel); border: 2px solid var(--neon-main); padding: 8px 16px; border-radius: 12px; box-shadow: 0 0 10px var(--neon-main); text-align: center; }
.score-val { font-size: 24px; font-weight: bold; color: var(--neon-main); }
.score-label { font-size: 12px; opacity: 0.7; }

/* SCREENS (Start, End, Editor) */
.screen { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: opacity 0.3s; pointer-events: auto; }
.hidden { opacity: 0; pointer-events: none; display: none !important; }

h1 { font-size: 40px; margin: 0 0 20px; color: var(--neon-main); text-shadow: 0 0 15px var(--neon-main); text-align: center; }
h2 { color: #fff; margin-bottom: 20px; text-align: center; }

.btn {
  background: linear-gradient(45deg, var(--neon-main), #00aaff);
  border: none; padding: 12px 30px; margin: 10px;
  font-size: 20px; font-weight: bold; color: #000;
  border-radius: 30px; cursor: pointer;
  box-shadow: 0 0 15px var(--neon-main);
  transition: transform 0.1s, filter 0.1s;
}
.btn:active { transform: scale(0.95); }
.btn:hover { filter: brightness(1.2); }
.btn.sec { background: transparent; border: 2px solid var(--neon-main); color: var(--neon-main); box-shadow: none; }
.btn.edit-mode { position: absolute; bottom: 20px; right: 20px; z-index: 50; width: 50px; height: 50px; padding: 0; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; }

/* QUESTION MODAL */
#Q_MODAL {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
  width: 90%; max-width: 500px;
  background: var(--panel); border: 3px solid var(--neon-main);
  border-radius: 20px; padding: 20px; z-index: 100;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
  display: flex; flex-direction: column; gap: 15px;
  opacity: 0; pointer-events: none; transition: 0.3s;
}
#Q_MODAL.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
#Q_TEXT { font-size: 22px; text-align: center; margin-bottom: 10px; line-height: 1.4; color: #fff; }
.ans-btn {
  background: var(--glass); border: 2px solid rgba(255,255,255,0.3);
  color: #fff; padding: 12px; border-radius: 10px;
  font-size: 18px; cursor: pointer; transition: 0.2s; text-align: left;
}
.ans-btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
.ans-btn.correct { background: var(--neon-main); color: #000; border-color: var(--neon-main); }
.ans-btn.wrong { background: var(--danger); border-color: var(--danger); }

/* --- EDITOR STYLES --- */
#EDITOR {
  position: absolute; inset: 0; z-index: 200; background: #1a1a1a;
  display: flex; flex-direction: column;
}
.ed-header {
  height: 60px; background: #2a2a2a; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #444;
}
.ed-tabs { display: flex; gap: 5px; height: 100%; align-items: flex-end; }
.ed-tab {
  padding: 10px 20px; background: #333; cursor: pointer; border-radius: 10px 10px 0 0; color: #aaa; transition: 0.2s;
}
.ed-tab.active { background: #444; color: #fff; font-weight: bold; }
.ed-body { flex: 1; padding: 20px; overflow-y: auto; background: #222; }
.ed-section { display: none; }
.ed-section.active { display: block; }

.form-group { margin-bottom: 15px; background: #333; padding: 15px; border-radius: 8px; }
.form-group label { display: block; margin-bottom: 5px; color: var(--neon-main); font-size: 14px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; background: #111; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px;
}
.list-item { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 5px; }
.list-item input { flex: 1; }
.del-btn { background: var(--danger); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }

/* Custom file input */
input[type="file"] { padding: 5px; background: #222; }

/* Toggle Switch */
.switch { position: relative; display: inline-block; width: 50px; height: 24px; margin-left: 10px; vertical-align: middle; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--neon-main); }
input:checked + .slider:before { transform: translateX(26px); }

/* Shake Animation */
.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }

</style>
</head>
<body>

<div id="GAME">
  <div id="BG"></div>
  <div id="UI_LAYER">
    <div class="top-bar">
      <div class="score-box">
        <div class="score-val" id="SCORE_DISP">0</div>
        <div class="score-label">СЧЕТ</div>
      </div>
      <div class="score-box">
        <div class="score-val" id="LEVEL_DISP">1</div>
        <div class="score-label">УРОВЕНЬ</div>
      </div>
    </div>
  </div>
  <canvas id="cvs"></canvas>

  <div id="START_SCREEN" class="screen">
    <h1>LEAP & LEARN</h1>
    <p style="color:#aaa; margin-bottom:30px">Обучающая аркада</p>
    <button class="btn" id="BTN_START">ИГРАТЬ</button>
    <button class="btn edit-mode" id="BTN_OPEN_EDITOR" title="Редактор">✎</button>
  </div>

  <div id="WIN_SCREEN" class="screen hidden">
    <h1 style="color:var(--win)">УРОВЕНЬ ПРОЙДЕН!</h1>
    <h2 id="WIN_MSG">Отличная работа!</h2>
    <div class="score-box" style="margin-bottom:20px">
      <div class="score-val" id="WIN_SCORE">0</div>
      <div class="score-label">ФИНАЛЬНЫЙ СЧЕТ</div>
    </div>
    <button class="btn" id="BTN_NEXT">СЛЕДУЮЩИЙ УРОВЕНЬ</button>
  </div>

  <div id="LOSE_SCREEN" class="screen hidden">
    <h1 style="color:var(--danger)">ОШИБКА!</h1>
    <h2 id="LOSE_MSG">Попробуй еще раз</h2>
    <button class="btn" id="BTN_RETRY">ЗАНОВО</button>
  </div>

  <div id="Q_MODAL">
    <div id="Q_TEXT">Вопрос...</div>
    <div id="ANSWERS_BOX" style="display:flex; flex-direction:column; gap:8px"></div>
  </div>
</div>

<div id="EDITOR" class="hidden">
  <div class="ed-header">
    <span style="color:#fff; font-weight:bold">РЕДАКТОР УРОВНЕЙ</span>
    <div>
      <button class="btn sec" style="padding:5px 15px; font-size:14px" id="BTN_SAVE_JSON">Скачать JSON</button>
      <button class="btn sec" style="padding:5px 15px; font-size:14px" onclick="document.getElementById('fileIn').click()">Загрузить JSON</button>
      <input type="file" id="fileIn" style="display:none" accept=".json">
      <button class="btn" style="padding:5px 15px; font-size:14px; margin:0" id="BTN_CLOSE_EDITOR">Играть</button>
    </div>
  </div>
  
  <div class="ed-tabs">
    <div class="ed-tab active" onclick="switchTab('gen')">Настройки</div>
    <div class="ed-tab" onclick="switchTab('quest')">Вопросы</div>
    <div class="ed-tab" onclick="switchTab('media')">Медиа</div>
  </div>

  <div class="ed-body">
    <div id="tab-gen" class="ed-section active">
      <div class="form-group">
        <label>Название игры</label>
        <input type="text" id="ED_TITLE" value="Leap & Learn">
      </div>
      <div class="form-group">
        <label>Скорость игры (1-10)</label>
        <input type="number" id="ED_SPEED" value="4" min="1" max="15">
      </div>
      <div class="form-group">
        <label>Фон (Ссылка на картинку)</label>
        <input type="text" id="ED_BG_URL" placeholder="https://...">
      </div>
    </div>

    <div id="tab-quest" class="ed-section">
      <div id="Q_LIST"></div>
      <button class="btn sec" onclick="addQuestion()" style="width:100%">+ Добавить вопрос</button>
    </div>

    <div id="tab-media" class="ed-section">
      <h3>Шрифты</h3>
      <div class="form-group">
        <label>Выберите шрифт интерфейса:</label>
        <select id="ED_FONT" onchange="updateFont(this.value)">
          <option value="'Segoe UI', sans-serif">Стандартный (Segoe UI)</option>
          <option value="'Courier New', monospace">Ретро (Courier)</option>
          <option value="'Georgia', serif">Книжный (Georgia)</option>
          <option value="'Verdana', sans-serif">Четкий (Verdana)</option>
          <option value="'Comic Sans MS', cursive">Веселый (Comic Sans)</option>
          <option value="'Impact', sans-serif">Жирный (Impact)</option>
        </select>
      </div>

      <hr style="border-color:#444; margin: 20px 0;">

      <h3>Пользовательские звуки</h3>
      <p style="color:#888; font-size:12px; margin-bottom:15px">Загрузите файлы mp3 или wav. Если файл не выбран, будет играть стандартный звук.</p>
      
      <div class="form-group">
        <label>🔊 Звук прыжка</label>
        <input type="file" accept="audio/*" onchange="loadSound('jump', this)">
      </div>
      <div class="form-group">
        <label>✅ Звук правильного ответа</label>
        <input type="file" accept="audio/*" onchange="loadSound('correct', this)">
      </div>
      <div class="form-group">
        <label>❌ Звук ошибки</label>
        <input type="file" accept="audio/*" onchange="loadSound('wrong', this)">
      </div>
      <div class="form-group">
        <label>🏆 Звук победы</label>
        <input type="file" accept="audio/*" onchange="loadSound('win', this)">
      </div>
    </div>
  </div>
</div>

<script>
/* --- GAME ENGINE --- */
const canvas = document.getElementById('cvs');
const ctx = canvas.getContext('2d');
let W, H;

// GAME STATE
let state = {
  running: false,
  paused: false,
  score: 0,
  level: 1,
  speed: 4,
  questions: [
    {q:"2 + 2 = ?", a:["4","5","3"], c:0},
    {q:"Столица Франции?", a:["Лондон","Париж","Берлин"], c:1},
    {q:"Земля круглая?", a:["Да","Нет"], c:0}
  ],
  qIndex: 0
};

// ASSETS & CONFIG
let assets = {
  bg: document.getElementById('BG'),
  playerCol: '#7cf9ff',
  font: "'Segoe UI', sans-serif"
};

// CUSTOM AUDIO BUFFER
const userAudio = {
  jump: null,
  correct: null,
  wrong: null,
  win: null
};

// AUDIO CONTEXT (For synthesis fallback)
const AuCtx = window.AudioContext || window.webkitAudioContext;
let actx = new AuCtx();

function playSound(type) {
  // 1. Try Custom Sound
  if (userAudio[type]) {
    userAudio[type].currentTime = 0;
    userAudio[type].play().catch(e=>console.log("Audio play error", e));
    return;
  }

  // 2. Fallback to Synth
  if(actx.state === 'suspended') actx.resume();
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.connect(g);
  g.connect(actx.destination);

  const now = actx.currentTime;
  
  if (type === 'jump') {
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  } else if (type === 'correct') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.setValueAtTime(800, now + 0.1);
    g.gain.setValueAtTime(0.3, now);
    g.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.linearRampToValueAtTime(100, now + 0.3);
    g.gain.setValueAtTime(0.3, now);
    g.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'win') {
    osc.type = 'triangle';
    // Simple arpeggio
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.setValueAtTime(400, now + 0.1);
    osc.frequency.setValueAtTime(500, now + 0.2);
    osc.frequency.setValueAtTime(600, now + 0.3);
    g.gain.setValueAtTime(0.3, now);
    g.gain.linearRampToValueAtTime(0, now + 0.8);
    osc.start(now);
    osc.stop(now + 0.8);
  }
}

// PLAYER
let player = {
  x: 50, y: 0, w: 40, h: 40, dy: 0, onG: false
};
const GRAVITY = 0.8;
const JUMP = -15;

// WORLD
let platforms = [];
let particles = [];
let cameraX = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  player.y = H - 150;
}
window.onresize = resize;
resize();

/* --- LOGIC --- */

function initLevel() {
  platforms = [];
  state.qIndex = 0;
  state.score = 0;
  cameraX = 0;
  player.x = 100;
  player.y = H - 200;
  player.dy = 0;
  
  // Create track
  let x = 0;
  for(let i=0; i<50; i++) {
    let w = 200 + Math.random()*300;
    let gap = 100 + Math.random()*150;
    platforms.push({x: x, y: H-100, w: w, h: 100, type: 'norm'});
    
    // Add question trigger occasionally
    if(i > 0 && i % 3 === 0) {
       platforms[platforms.length-1].hasQ = true;
       platforms[platforms.length-1].color = '#ffe44d';
    }
    
    x += w + gap;
  }
  // Finish line
  platforms.push({x: x, y: H-100, w: 500, h: 100, type: 'win'});
}

function update() {
  if(!state.running || state.paused) return;

  // Player Physics
  player.dy += GRAVITY;
  player.y += player.dy;
  player.x += state.speed;

  // Floor Collision
  player.onG = false;
  let onPlat = false;
  
  // Camera follow
  cameraX = player.x - 200;

  // Platforms Logic
  for(let p of platforms) {
    if(player.x + player.w > p.x && player.x < p.x + p.w &&
       player.y + player.h > p.y && player.y + player.h < p.y + p.h + 20 &&
       player.dy >= 0) {
      
      player.y = p.y - player.h;
      player.dy = 0;
      player.onG = true;
      onPlat = true;

      // Question Trigger
      if(p.hasQ && !p.used) {
        p.used = true;
        askQuestion();
      }
      // Win Trigger
      if(p.type === 'win') {
        winLevel();
      }
    }
  }

  // Fall death
  if(player.y > H) {
    playSound('wrong');
    gameOver();
  }

  // Jump input
  if(keys.space && player.onG) {
    player.dy = JUMP;
    playSound('jump');
    createParticles(player.x, player.y + player.h);
  }

  render();
  requestAnimationFrame(update);
}

function render() {
  ctx.fillStyle = "#0a1730"; // Clear
  ctx.fillRect(0,0,W,H);
  
  ctx.save();
  ctx.translate(-cameraX, 0);

  // Platforms
  for(let p of platforms) {
    ctx.fillStyle = p.type === 'win' ? '#55ff55' : (p.hasQ ? (p.used?'#555':'#ffe44d') : '#ff00ff');
    // Neon glow effect
    ctx.shadowBlur = 15;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.shadowBlur = 0;
  }

  // Player
  ctx.fillStyle = state.playerCol; // custom color possible?
  ctx.shadowBlur = 20;
  ctx.shadowColor = state.playerCol;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Particles
  for(let i=particles.length-1; i>=0; i--) {
    let pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.life--;
    ctx.fillStyle = `rgba(255,255,255,${pt.life/30})`;
    ctx.fillRect(pt.x, pt.y, 4, 4);
    if(pt.life <=0) particles.splice(i,1);
  }

  ctx.restore();

  // HUD
  document.getElementById('SCORE_DISP').innerText = state.score;
}

/* --- INTERACTION --- */
const keys = { space: false };
window.onkeydown = e => { if(e.code==='Space') keys.space = true; };
window.onkeyup = e => { if(e.code==='Space') keys.space = false; };
window.ontouchstart = () => { keys.space = true; };
window.ontouchend = () => { keys.space = false; };

function createParticles(x,y) {
  for(let i=0; i<10; i++) {
    particles.push({x:x, y:y, vx:(Math.random()-0.5)*5, vy:Math.random()*-5, life:30});
  }
}

/* --- GAME FLOW --- */
function startGame() {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  initLevel();
  state.running = true;
  state.paused = false;
  state.level = 1;
  update();
  playSound('jump'); // test sound
}

function gameOver() {
  state.running = false;
  document.getElementById('LOSE_SCREEN').classList.remove('hidden');
  document.getElementById('GAME').classList.add('shake');
  setTimeout(()=>document.getElementById('GAME').classList.remove('shake'), 500);
}

function winLevel() {
  state.running = false;
  playSound('win');
  document.getElementById('WIN_SCORE').innerText = state.score;
  document.getElementById('WIN_SCREEN').classList.remove('hidden');
}

/* --- QUESTIONS --- */
function askQuestion() {
  state.paused = true;
  let qData = state.questions[state.qIndex % state.questions.length];
  
  const modal = document.getElementById('Q_MODAL');
  const txt = document.getElementById('Q_TEXT');
  const box = document.getElementById('ANSWERS_BOX');
  
  txt.innerText = qData.q;
  box.innerHTML = '';
  
  qData.a.forEach((ans, idx) => {
    let btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.innerText = ans;
    btn.onclick = () => checkAnswer(idx, qData.c, btn);
    box.appendChild(btn);
  });
  
  modal.classList.add('active');
  state.qIndex++;
}

function checkAnswer(idx, correctIdx, btnEl) {
  if(idx === correctIdx) {
    btnEl.classList.add('correct');
    state.score += 100;
    playSound('correct');
    setTimeout(() => {
      document.getElementById('Q_MODAL').classList.remove('active');
      state.paused = false;
      update(); // resume loop
    }, 800);
  } else {
    btnEl.classList.add('wrong');
    playSound('wrong');
    state.score -= 50;
    setTimeout(() => {
      document.getElementById('Q_MODAL').classList.remove('active');
      gameOver();
    }, 800);
  }
}

/* --- EDITOR --- */
const ED = document.getElementById('EDITOR');

// Open Editor
document.getElementById('BTN_OPEN_EDITOR').onclick = () => {
  ED.classList.remove('hidden');
  renderQList();
  
  // Sync inputs
  document.getElementById('ED_TITLE').value = document.querySelector('h1').innerText;
  document.getElementById('ED_SPEED').value = state.speed;
};

// Close Editor
document.getElementById('BTN_CLOSE_EDITOR').onclick = () => {
  ED.classList.add('hidden');
  // Apply Settings
  document.querySelector('h1').innerText = document.getElementById('ED_TITLE').value;
  state.speed = parseInt(document.getElementById('ED_SPEED').value);
  let bgUrl = document.getElementById('ED_BG_URL').value;
  if(bgUrl) document.getElementById('BG').style.backgroundImage = `url("${bgUrl}")`;
};

// Tabs
function switchTab(t) {
  document.querySelectorAll('.ed-tab').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.ed-section').forEach(e => e.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}

// Question Editor Logic
function renderQList() {
  const lst = document.getElementById('Q_LIST');
  lst.innerHTML = '';
  state.questions.forEach((q, i) => {
    let d = document.createElement('div');
    d.className = 'list-item';
    d.innerHTML = `<b>${i+1}.</b> <input value="${q.q}" onchange="updateQ(${i}, 'q', this.value)">
    <button class="del-btn" onclick="delQ(${i})">×</button>`;
    lst.appendChild(d);
  });
}
function addQuestion() {
  state.questions.push({q:"Новый вопрос", a:["А","Б"], c:0});
  renderQList();
}
function delQ(i) {
  state.questions.splice(i, 1);
  renderQList();
}
function updateQ(i, field, val) {
  state.questions[i][field] = val;
}

// Fonts
function updateFont(f) {
  assets.font = f;
  document.body.style.fontFamily = f;
  // Apply to canvas context if needed re-render
}

// --- NEW: SOUND UPLOAD HANDLER ---
function loadSound(type, input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      userAudio[type] = new Audio(e.target.result);
      // Play once to test
      userAudio[type].volume = 0.5;
      userAudio[type].play(); 
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// JSON Import/Export
document.getElementById('BTN_SAVE_JSON').onclick = () => {
  const data = {
    settings: {
      title: document.getElementById('ED_TITLE').value,
      speed: state.speed,
      bg: document.getElementById('ED_BG_URL').value,
      font: assets.font
    },
    questions: state.questions
  };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='game_level.json'; a.click();
};

document.getElementById('fileIn').onchange = (e) => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = (evt) => {
    try {
      const d = JSON.parse(evt.target.result);
      if(d.questions) state.questions = d.questions;
      if(d.settings) {
         document.getElementById('ED_TITLE').value = d.settings.title || "Game";
         document.getElementById('ED_SPEED').value = d.settings.speed || 4;
         document.getElementById('ED_BG_URL').value = d.settings.bg || "";
         if(d.settings.font) updateFont(d.settings.font);
      }
      renderQList();
      alert("Уровень загружен!");
    } catch(err) { alert("Ошибка файла"); }
  };
  r.readAsText(f);
};

/* --- DOM EVENTS --- */
document.getElementById('BTN_START').onclick = startGame;
document.getElementById('BTN_RETRY').onclick = startGame;
document.getElementById('BTN_NEXT').onclick = startGame;

</script>
