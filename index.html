<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Leap and Learn Editor - Final Stable</title>
    <style>
        :root { --accent: #7cf9ff; --bg: #0b1630; --panel: #16213e; --danger: #ff4757; --success: #4ecca3; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; background: var(--bg); color: white; overflow: hidden; }
        
        /* Боковая панель */
        #sidebar { width: 420px; min-width: 420px; background: var(--panel); padding: 20px; overflow-y: auto; border-right: 2px solid var(--accent); box-shadow: 10px 0 20px rgba(0,0,0,0.5); z-index: 10; }
        .section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(124,249,255,0.1); }
        h3 { margin-top: 0; color: var(--accent); font-size: 14px; text-transform: uppercase; border-bottom: 1px solid rgba(124,249,255,0.3); padding-bottom: 5px; margin-bottom: 15px; }
        
        label { display: block; margin: 10px 0 5px; font-size: 12px; font-weight: bold; color: var(--accent); }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(124,249,255,0.3); background: #0f3460; color: white; box-sizing: border-box; margin-bottom: 5px; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; text-transform: uppercase; }
        .btn:hover { filter: brightness(1.2); }
        .btn-yellow { background: #ffe44d; color: #000; padding: 5px 10px; width: auto; font-size: 12px; }
        .btn-danger { background: var(--danger); color: white; padding: 5px 10px; width: auto; }
        .btn-add { background: var(--success); color: white; margin-top: 10px; }

        /* Карточки уровней */
        .level-card { 
            background: rgba(0,0,0,0.2); padding: 12px; margin: 10px 0; border-radius: 8px; 
            display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(124,249,255,0.2);
        }
        .level-info { font-size: 14px; font-weight: bold; }

        /* Превью */
        #preview-container { flex-grow: 1; display: flex; flex-direction: column; background: #000; }
        .top-bar { padding: 10px 20px; background: #0f3460; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent); }
        #game-frame { width: 100%; height: 100%; border: none; background: #fff; }

        /* Модальное окно */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; padding: 25px; border-radius: 15px; border: 2px solid var(--accent); }
        .q-item { background: rgba(255,255,255,0.05); padding: 15px; margin-bottom: 15px; border-radius: 10px; position: relative; }
        
        .upload-btn { font-size: 11px; color: var(--accent); cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="color:var(--accent); text-align:center;">🐸 Leap & Learn Editor</h2>
    
    <div class="section">
        <h3>📍 Локация и Платформы</h3>
        <label>Фон (Река/Лава/Болото или Свой URL)</label>
        <select id="bgSelect" onchange="toggleCustom('bg')">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/c0c9010f-c3dd-42c1-b7c1-65024fa3aec6.png">Река (Синий)</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/fa2ab459-fec9-4ccd-97e3-254427b4ade0.png">Лава (Красный)</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/02b52ad4-9d31-4b21-a305-8fec6e8a4487.png">Болото (Зеленый)</option>
            <option value="custom">Своя ссылка...</option>
        </select>
        <input type="text" id="bgCustom" style="display:none" oninput="updatePreview()" placeholder="Вставьте ссылку">
        <input type="file" id="bgFile" style="display:none" onchange="uploadImage(this, 'bgCustom')">
        <span class="upload-btn" onclick="document.getElementById('bgFile').click()">Загрузить свой фон</span>

        <label>Платформа</label>
        <select id="platSelect" onchange="toggleCustom('plat')">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/ed6c6e82-953b-43d4-947d-e46227b760f0.png">Лилия</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/bad37c6d-f04c-45c0-b954-807d79ec3a95.png">Камень</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/c6775617-bde5-43e4-9da8-5332d928807e.png">Болотная кочка</option>
            <option value="custom">Своя ссылка...</option>
        </select>
        <input type="text" id="platCustom" style="display:none" oninput="updatePreview()" placeholder="Вставьте ссылку на картинку">
    </div>

    <div class="section">
        <h3>🎭 Персонаж</h3>
        <label>Герой</label>
        <select id="charSelect" onchange="toggleCustom('char')">
            <option value="https://img.genially.com/67961b32a116fb001568a75e/3074df22-5c73-4ad2-b0b2-491c6fc247f3.png">Лягушка</option>
            <option value="https://img.genially.com/67961b32a116fb001568a75e/74b56fcf-5354-43dd-9c9a-f50facc9a9bf.png">Хамелеон</option>
            <option value="custom">Свой URL...</option>
        </select>
        <input type="text" id="charCustom" style="display:none" oninput="updatePreview()">
    </div>

    <div class="section">
        <h3>🎮 Уровни (Сложность: <span id="timerVal">10</span>с)</h3>
        <input type="range" min="3" max="20" value="10" id="timeSlider" oninput="timerVal.textContent=this.value; updatePreview()">
        <div id="levelList"></div>
        <button class="btn btn-add" onclick="addLevel()">+ Добавить уровень</button>
    </div>
</div>

<div id="preview-container">
    <div class="top-bar">
        <span>ПРЕДПРОСМОТР: Leap & Learn</span>
        <button class="btn" style="width:auto; padding:5px 15px; background:white;" onclick="copyCode()">СКОПИРОВАТЬ КОД ДЛЯ GITHUB</button>
    </div>
    <iframe id="game-frame"></iframe>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Редактирование вопросов</h2>
        <div id="qList"></div>
        <button class="btn btn-add" onclick="addQuestion()">+ Добавить вопрос</button>
        <button class="btn" style="margin-top:20px" onclick="closeModal()">СОХРАНИТЬ</button>
    </div>
</div>

<script>
    let currentLvl = 0;
    let gameData = {
        levels: [
            { name: "Уровень 1", questions: [{text: "I ____ ready.", answers: ["am","is","are"], correct: 0}] }
        ]
    };

    function toggleCustom(id) {
        const sel = document.getElementById(id+'Select');
        const cust = document.getElementById(id+'Custom');
        cust.style.display = sel.value === 'custom' ? 'block' : 'none';
        updatePreview();
    }

    function uploadImage(input, targetId) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(targetId).value = e.target.result;
            updatePreview();
        };
        reader.readAsDataURL(file);
    }

    function addLevel() {
        gameData.levels.push({
            name: "Уровень " + (gameData.levels.length + 1),
            questions: [{text: "Новый вопрос", answers: ["1","2","3"], correct: 0}]
        });
        renderLevels();
        updatePreview();
    }

    function deleteLevel(idx) {
        if(gameData.levels.length > 1) {
            gameData.levels.splice(idx, 1);
            renderLevels();
            updatePreview();
        }
    }

    function renderLevels() {
        const container = document.getElementById('levelList');
        container.innerHTML = gameData.levels.map((l, i) => `
            <div class="level-card">
                <div class="level-info">${l.name} (${l.questions.length} вопр.)</div>
                <div style="display:flex; gap:5px">
                    <button class="btn btn-yellow" onclick="openModal(${i})">⚙️ Вопросы</button>
                    <button class="btn btn-danger" onclick="deleteLevel(${i})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function openModal(idx) {
        currentLvl = idx;
        document.getElementById('modal').style.display = 'flex';
        renderQuestions();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; renderLevels(); updatePreview(); }

    function renderQuestions() {
        const container = document.getElementById('qList');
        const qs = gameData.levels[currentLvl].questions;
        container.innerHTML = qs.map((q, i) => `
            <div class="q-item">
                <input type="text" value="${q.text}" placeholder="Вопрос" oninput="gameData.levels[${currentLvl}].questions[${i}].text=this.value">
                <div style="display:flex; gap:5px; margin:10px 0">
                    <input type="text" value="${q.answers[0]}" oninput="gameData.levels[${currentLvl}].questions[${i}].answers[0]=this.value">
                    <input type="text" value="${q.answers[1]}" oninput="gameData.levels[${currentLvl}].questions[${i}].answers[1]=this.value">
                    <input type="text" value="${q.answers[2]}" oninput="gameData.levels[${currentLvl}].questions[${i}].answers[2]=this.value">
                </div>
                <select onchange="gameData.levels[${currentLvl}].questions[${i}].correct=parseInt(this.value)">
                    <option value="0" ${q.correct==0?'selected':''}>Верный ответ: 1</option>
                    <option value="1" ${q.correct==1?'selected':''}>Верный ответ: 2</option>
                    <option value="2" ${q.correct==2?'selected':''}>Верный ответ: 3</option>
                </select>
                <button class="upload-btn" style="color:red" onclick="gameData.levels[${currentLvl}].questions.splice(${i},1); renderQuestions()">Удалить вопрос</button>
            </div>
        `).join('');
    }

    function addQuestion() {
        gameData.levels[currentLvl].questions.push({text: "", answers: ["","",""], correct: 0});
        renderQuestions();
    }

    function updatePreview() {
        const frame = document.getElementById('game-frame');
        const getV = (id) => {
            const s = document.getElementById(id+'Select');
            return s.value === 'custom' ? document.getElementById(id+'Custom').value : s.value;
        };

        const config = {
            bg: getV('bg'), plat: getV('plat'), char: getV('char'),
            time: document.getElementById('timeSlider').value,
            levels: gameData.levels
        };

        // Вставляем твой ОРИГИНАЛЬНЫЙ движок игры
        const finalHTML = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial; }
        #GAME { position: relative; width: 100%; height: 100%; background: #000; }
        #BG { position: absolute; inset: 0; background: url("${config.bg}") center/cover; }
        #QUESTION { position: absolute; top: 40px; width: 100%; text-align: center; color: white; font-size: 30px; text-shadow: 2px 2px 4px #000; z-index: 10; }
        #TIMER { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: rgba(0,0,0,0.5); border: 2px solid #7cf9ff; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 10; }
        #FROG { position: absolute; left: 150px; bottom: 30%; width: 100px; height: 100px; background: url("${config.char}") no-repeat center/contain; z-index: 5; transition: transform 0.5s; }
        #PLATFORMS { position: absolute; inset: 0; z-index: 2; }
        .platform { position: absolute; width: 150px; height: 150px; background: url("${config.plat}") no-repeat center/contain; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: transform 0.5s, opacity 0.5s; }
        #OVERLAY { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; }
        .btn { padding: 15px 30px; background: #7cf9ff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="GAME">
        <div id="BG"></div>
        <div id="QUESTION">Жми начать!</div>
        <div id="TIMER"></div>
        <div id="FROG"></div>
        <div id="PLATFORMS"></div>
        <div id="OVERLAY">
            <h1 id="STATUS"></h1>
            <button class="btn" onclick="location.reload()">ЗАНОВО</button>
        </div>
    </div>
    <script>
        const levels = ${JSON.stringify(config.levels)};
        let curL = 0, curQ = 0, timer, time;

        function start() {
            loadQ();
        }

        function loadQ() {
            const q = levels[curL].questions[curQ];
            document.getElementById('QUESTION').innerText = q.text;
            renderPlats(q);
            startTime();
        }

        function renderPlats(q) {
            const p = document.getElementById('PLATFORMS');
            p.innerHTML = "";
            q.answers.forEach((ans, i) => {
                const d = document.createElement('div');
                d.className = 'platform';
                d.style.left = (400 + i * 200) + 'px';
                d.style.bottom = '30%';
                d.innerText = ans;
                d.onclick = () => check(i, d);
                p.appendChild(d);
            });
        }

        function startTime() {
            time = ${config.time};
            document.getElementById('TIMER').innerText = time;
            clearInterval(timer);
            timer = setInterval(() => {
                time--;
                document.getElementById('TIMER').innerText = time;
                if(time <= 0) end(false);
            }, 1000);
        }

        function check(i, el) {
            const q = levels[curL].questions[curQ];
            const correct = (i === q.correct);
            
            // Двигаем платформы (имитация прыжка)
            const shift = el.offsetLeft - 150;
            document.querySelectorAll('.platform').forEach(p => {
                p.style.transform = "translateX(-" + shift + "px)";
            });

            setTimeout(() => {
                if(correct) {
                    curQ++;
                    if(curQ >= levels[curL].questions.length) {
                        curL++; curQ = 0;
                        if(curL >= levels.length) return end(true);
                    }
                    loadQ();
                } else {
                    el.style.opacity = "0";
                    document.getElementById('FROG').style.transform = "translateY(100px)";
                    setTimeout(() => end(false), 500);
                }
            }, 500);
        }

        function end(win) {
            clearInterval(timer);
            document.getElementById('OVERLAY').style.display = "flex";
            document.getElementById('STATUS').innerText = win ? "ПОБЕДА!" : "НЕ ПОВЕЗЛО...";
        }

        start();
    <\/script>
</body>
</html>`;
        frame.srcdoc = finalHTML;
    }

    function copyCode() {
        navigator.clipboard.writeText(document.getElementById('game-frame').srcdoc);
        alert("Код скопирован!");
    }

    renderLevels();
    updatePreview();
</script>
</body>
</html>
